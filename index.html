<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShivaOS</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&display=swap');

        :root {
            --bg: #000000;
            --glass: rgba(20, 20, 20, 0.85);
            --gold: #FFD700;
            --accent: #00E5FF;
            --text: #ffffff;
            --app-bg: #121212;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }

        body {
            margin: 0; background: url('https://www.transparenttextures.com/patterns/stardust.png'), radial-gradient(circle at 50% 30%, #1a0b2e, #000000);
            font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; color: var(--text);
        }

        /* --- LOCK SCREEN (The Gate) --- */
        #lock-screen {
            position: fixed; inset: 0; z-index: 10000; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .mandala-btn {
            width: 120px; height: 120px; border: 2px solid var(--gold); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 3rem;
            animation: pulse 3s infinite; cursor: pointer; background: rgba(255,215,0,0.1);
        }
        @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,215,0,0.4);} 70%{box-shadow:0 0 0 20px rgba(255,215,0,0);} 100%{box-shadow:0 0 0 0 rgba(255,215,0,0);} }

        /* --- STATUS BAR --- */
        #status-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: calc(30px + var(--safe-top));
            padding-top: var(--safe-top); display: flex; justify-content: space-between; align-items: center;
            padding-left: 20px; padding-right: 20px; font-size: 0.8rem; z-index: 500; font-weight: 600;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        /* --- HOME SCREEN (App Grid) --- */
        #home-screen {
            padding: calc(60px + var(--safe-top)) 20px 100px 20px;
            height: 100vh; overflow-y: auto;
        }
        .app-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px;
        }
        .app-icon {
            display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s;
        }
        .app-icon:active { transform: scale(0.9); opacity: 0.8; }
        .icon-box {
            width: 60px; height: 60px; border-radius: 16px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .icon-label { font-size: 0.7rem; color: #ccc; text-align: center; font-weight: 500; letter-spacing: 0.3px; }

        /* --- APP WINDOW (The Opened App) --- */
        .app-window {
            position: fixed; inset: 0; background: var(--app-bg); z-index: 2000;
            display: flex; flex-direction: column; transform: scale(0.9) translateY(20px); opacity: 0; pointer-events: none;
            transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .app-window.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: auto; }
        
        .app-header {
            height: calc(50px + var(--safe-top)); padding-top: var(--safe-top);
            display: flex; align-items: center; padding-left: 15px; padding-right: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(18,18,18,0.95);
        }
        .back-btn { font-size: 1.5rem; padding: 10px; cursor: pointer; color: var(--gold); }
        .app-title { flex: 1; text-align: center; font-family: 'Cinzel'; font-weight: 700; color: #fff; }
        .app-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: calc(20px + var(--safe-bottom)); }

        /* --- INTERNAL UI ELEMENTS --- */
        .card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .btn-main { width: 100%; padding: 15px; background: var(--gold); border: none; border-radius: 12px; color: #000; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .list-item { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        
        /* 3D Objects */
        .lingam { width: 100px; height: 140px; background: radial-gradient(circle at 30% 30%, #444, #000); border-radius: 50px 50px 30px 30px; margin: 20px auto; position: relative; }
        .tripundra { position: absolute; top: 40px; left: 15%; width: 70%; height: 30px; opacity: 0.8; }
        
        /* Diet */
        .diet-toggle { display: flex; background: #222; border-radius: 20px; padding: 4px; margin-bottom: 20px; }
        .dt-opt { flex: 1; text-align: center; padding: 8px; font-size: 0.8rem; border-radius: 16px; cursor: pointer; color: #888; }
        .dt-opt.active { background: var(--gold); color: #000; font-weight: bold; }

    </style>
</head>
<body>

    <div id="lock-screen" onclick="OS.unlock()">
        <div class="mandala-btn">🕉️</div>
        <p style="margin-top: 20px; font-family: 'Cinzel'; letter-spacing: 3px; font-size: 0.8rem;">TAP TO AWAKEN</p>
    </div>

    <div id="status-bar">
        <div id="clock">12:00</div>
        <div style="color: var(--gold);">Karma: <span id="karma-pts">0</span></div>
    </div>

    <div id="home-screen">
        <div class="app-grid" id="grid-container">
            </div>
    </div>

    <div id="app-window" class="app-window">
        <div class="app-header">
            <div class="back-btn" onclick="OS.closeApp()">❮</div>
            <div class="app-title" id="win-title">App Name</div>
            <div style="width: 40px;"></div> </div>
        <div class="app-content" id="win-content">
            </div>
    </div>

    <script>
        /* --- SYSTEM CORE --- */
        const OS = {
            karma: parseInt(localStorage.getItem('shiva_karma') || 0),
            
            init() {
                this.renderGrid();
                this.updateClock();
                this.updateKarma(0);
                setInterval(this.updateClock, 1000);
            },

            unlock() {
                document.getElementById('lock-screen').style.transform = "translateY(-100%)";
                this.playAudio('unlock');
            },

            updateKarma(points) {
                this.karma += points;
                localStorage.setItem('shiva_karma', this.karma);
                document.getElementById('karma-pts').innerText = this.karma;
                if(points > 0) this.playAudio('coin');
            },

            updateClock() {
                const now = new Date();
                document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            },

            playAudio(type) {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                
                if (type === 'unlock') {
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.3);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'coin') {
                    osc.frequency.setValueAtTime(1000, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                }
            },

            /* --- APP MANAGEMENT --- */
            apps: [
                {id:'panchang', n:'Panchang', i:'📅', c:'#4CAF50'},
                {id:'sanctum', n:'Sanctum', i:'🕉️', c:'#FFD700'},
                {id:'ahara', n:'Ahara', i:'🥗', c:'#81C784'},
                {id:'sadhana', n:'Sadhana', i:'📿', c:'#FF8A65'},
                {id:'media', n:'Media', i:'📺', c:'#FF5252'},
                {id:'parivar', n:'Parivar', i:'👪', c:'#BA68C8'},
                {id:'gyan', n:'Gyan', i:'📜', c:'#FFD54F'},
                {id:'yantra', n:'Yantra', i:'🧿', c:'#4FC3F7'},
                {id:'sankalpa', n:'Sankalpa', i:'🎯', c:'#E57373'},
                {id:'prasad', n:'Prasad', i:'🏆', c:'#F06292'},
                {id:'yatra', n:'Yatra', i:'📍', c:'#A1887F'},
                {id:'mantra', n:'Mantra', i:'🗣️', c:'#90A4AE'},
                {id:'chakra', n:'Chakra', i:'🧘', c:'#7986CB'},
                {id:'festivals', n:'Utsav', i:'🎉', c:'#FFB74D'},
                {id:'community', n:'Sangha', i:'🌍', c:'#4DB6AC'},
                {id:'ascent', n:'Ascent', i:'🏔️', c:'#9575CD'},
                {id:'daan', n:'Daan', i:'🤲', c:'#AED581'},
                {id:'dreams', n:'Dreams', i:'🌙', c:'#64B5F6'},
                {id:'rudra', n:'Rudraksha', i:'🌰', c:'#DCE775'},
                {id:'settings', n:'Settings', i:'⚙️', c:'#E0E0E0'}
            ],

            renderGrid() {
                const grid = document.getElementById('grid-container');
                grid.innerHTML = this.apps.map(app => `
                    <div class="app-icon" onclick="OS.openApp('${app.id}')">
                        <div class="icon-box" style="color:${app.c}">${app.i}</div>
                        <div class="icon-label">${app.n}</div>
                    </div>
                `).join('');
            },

            openApp(id) {
                const app = this.apps.find(a => a.id === id);
                document.getElementById('win-title').innerText = app.n;
                document.getElementById('win-content').innerHTML = AppsContent[id](); // Load content
                document.getElementById('app-window').classList.add('open');
            },

            closeApp() {
                document.getElementById('app-window').classList.remove('open');
            }
        };

        /* --- APP CONTENT GENERATORS --- */
        const AppsContent = {
            
            panchang: () => {
                let html = `<div class="card"><div style="text-align:center; font-size:4rem;">14</div><div style="text-align:center;">December 2025</div></div>`;
                html += `<div class="card"><b>Upcoming</b><br>Pradosh Vrat: Dec 18<br>Shivratri: Jan 14</div>`;
                html += `<button class="btn-main" onclick="alert('Alarm Set for 6:00 AM'); OS.updateKarma(5)">⏰ Set Puja Alarm</button>`;
                return html;
            },

            sanctum: () => `
                <div class="card" style="text-align:center;">
                    <div class="lingam" id="lingam-visual" style="border:1px solid #333;"></div>
                    <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
                        <button class="btn-main" style="width:auto;" onclick="OS.updateKarma(5); alert('Water Offered')">💧 Jal</button>
                        <button class="btn-main" style="width:auto; background:#ff5252; color:#fff;" onclick="OS.updateKarma(2); alert('Diya Lit')">🔥 Deep</button>
                        <button class="btn-main" style="width:auto; background:#aaa;" onclick="alert('Bell Sound!')">🔔 Bell</button>
                    </div>
                </div>
            `,

            ahara: () => `
                <div class="diet-toggle">
                    <div class="dt-opt active" onclick="this.classList.add('active'); this.nextElementSibling.classList.remove('active'); document.getElementById('food-list').innerHTML='<li>Milk & Fruit</li><li>Sabudana Khichdi</li>';">Fasting</div>
                    <div class="dt-opt" onclick="this.classList.add('active'); this.previousElementSibling.classList.remove('active'); document.getElementById('food-list').innerHTML='<li>Dal Rice</li><li>Roti Sabzi</li>';">Satvik</div>
                </div>
                <div class="card">
                    <ul id="food-list" style="padding-left:20px; line-height:2;">
                        <li>Milk & Fruit</li>
                        <li>Sabudana Khichdi</li>
                        <li>Roasted Nuts</li>
                    </ul>
                </div>
                <button class="btn-main" onclick="window.open('https://www.youtube.com/results?search_query=satvik+recipes')">Watch Recipes</button>
            `,

            sadhana: () => `
                <div class="card" style="text-align:center;">
                    <h2>Japa Counter</h2>
                    <h1 id="japa-cnt" style="font-size:4rem; color:var(--gold);">0</h1>
                    <button class="btn-main" onclick="document.getElementById('japa-cnt').innerText++; OS.updateKarma(1); if(navigator.vibrate) navigator.vibrate(10);">Chant Bead</button>
                </div>
                <div class="card">
                    <h3>Voice Recorder</h3>
                    <button class="btn-main" style="background:#333; color:#fff;" onclick="this.style.background='red'; this.innerText='Recording...'">🎙️ Start Recording</button>
                </div>
            `,

            media: () => `
                <div class="list-item" onclick="window.open('https://www.youtube.com/results?search_query=live+mahakaleshwar')">
                    <span>🔴 Live Mahakal Aarti</span><span>📺</span>
                </div>
                <div class="list-item" onclick="window.open('https://www.youtube.com/results?search_query=live+kashi+vishwanath')">
                    <span>🔴 Live Kashi Darshan</span><span>📺</span>
                </div>
                <div class="list-item" onclick="window.open('https://open.spotify.com/playlist/37i9dQZF1DX6aTaZa0K6VA')">
                    <span>🎵 Shiva Chants (Spotify)</span><span>🎧</span>
                </div>
            `,

            parivar: () => `
                <div class="card" style="display:flex; align-items:center; gap:15px;">
                    <div style="font-size:2.5rem;">🐘</div>
                    <div><b>Ganesh</b><br>Remover of Obstacles</div>
                </div>
                <div class="card" style="display:flex; align-items:center; gap:15px;">
                    <div style="font-size:2.5rem;">🔱</div>
                    <div><b>Shiva</b><br>The Destroyer</div>
                </div>
                <div class="card" style="display:flex; align-items:center; gap:15px;">
                    <div style="font-size:2.5rem;">🦁</div>
                    <div><b>Parvati</b><br>Divine Energy</div>
                </div>
            `,

            gyan: () => `
                <div class="card">
                    <h3>Ask the Guru</h3>
                    <input type="text" placeholder="I feel anxious..." style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:10px;">
                    <button class="btn-main" onclick="alert('Look within. You are the silence behind the noise.')">Seek Guidance</button>
                </div>
            `,

            yantra: () => `
                <div class="card" style="text-align:center;">
                    <div style="width:200px; height:200px; margin:0 auto; background:conic-gradient(#333,#000,#333); border-radius:50%; animation:pulse 4s infinite;"></div>
                    <p style="margin-top:20px;">Gaze at the center for 5 minutes.</p>
                    <button class="btn-main" onclick="OS.updateKarma(10); alert('Session Complete')">Finish (+10 KP)</button>
                </div>
            `,

            sankalpa: () => `
                <div class="card">
                    <h3>My Vows</h3>
                    <input id="vow-inp" type="text" placeholder="E.g. Chant 108 times" style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:8px;">
                    <button class="btn-main" onclick="document.getElementById('vow-list').innerHTML += '<li>'+document.getElementById('vow-inp').value+'</li>'; OS.updateKarma(5);">Commit Vow</button>
                    <ul id="vow-list" style="margin-top:20px;"></ul>
                </div>
            `,

            prasad: () => `
                <div class="card" style="text-align:center;">
                    <div style="font-size:3rem; color:var(--gold);">${OS.karma}</div>
                    <div>Total Karma Points</div>
                </div>
                <div class="card">
                    <h3>Level: Sadhaka</h3>
                    <div style="height:10px; background:#333; border-radius:5px; margin-top:10px;"><div style="width:45%; height:100%; background:var(--accent);"></div></div>
                </div>
            `,

            yatra: () => `
                <div class="card">
                    <input id="city-inp" type="text" placeholder="Enter City" style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:8px;">
                    <button class="btn-main" onclick="document.getElementById('gmap').src='https://www.google.com/maps?q=$' + document.getElementById('city-inp').value + '+shiva+temple&output=embed'">Search Temples</button>
                </div>
                <iframe id="gmap" width="100%" height="300" style="border:0; border-radius:12px; filter:invert(90%);" src=""></iframe>
            `,

            mantra: () => `<div class="card"><b>Maha Mrityunjaya</b><p style="color:#aaa;">Om Tryambakam Yajamahe...</p></div><div class="card"><b>Rudra Gayatri</b><p style="color:#aaa;">Om Tatpurushaya Vidmahe...</p></div>`,
            
            chakra: () => `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"><div class="card" style="text-align:center; color:red;">Root<br>Lam</div><div class="card" style="text-align:center; color:orange;">Sacral<br>Vam</div><div class="card" style="text-align:center; color:yellow;">Solar<br>Ram</div><div class="card" style="text-align:center; color:green;">Heart<br>Yam</div></div>`,
            
            festivals: () => `<div class="card" style="text-align:center;"><h1>34</h1><p>Days to Maha Shivratri</p></div>`,
            
            community: () => `<div class="card" style="text-align:center;"><h1>1,420</h1><p>Devotees Chanting Now</p></div>`,
            
            ascent: () => `<div style="padding:20px; border-left:2px solid var(--gold); margin-left:20px;"><div style="margin-bottom:30px;">1. Yama</div><div style="margin-bottom:30px;">2. Niyama</div><div style="margin-bottom:30px;">3. Asana</div><div>4. Pranayama</div></div>`,
            
            daan: () => `<div class="card"><textarea style="width:100%; background:#000; color:#fff; border:1px solid #333; padding:10px;" placeholder="I helped someone by..."></textarea><button class="btn-main" onclick="OS.updateKarma(20); alert('Seva Recorded')">Log Seva</button></div>`,
            
            dreams: () => `<div class="card"><textarea style="width:100%; height:150px; background:#000; color:#fff; border:1px solid #333; padding:10px;" placeholder="Last night I dreamt..."></textarea><button class="btn-main">Save Entry</button></div>`,
            
            rudra: () => `<div class="card"><b>1 Mukhi</b><p>Ruled by Shiva himself.</p></div><div class="card"><b>5 Mukhi</b><p>The most common, for general health.</p></div>`,
            
            settings: () => `<div class="card"><button class="btn-main" style="background:#333; color:#fff;" onclick="localStorage.clear(); location.reload();">Reset App Data</button></div>`
        };

        // Start
        OS.init();
    </script>
</body>
</html>
