<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ShivaOS: 3D Sanctum</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Cinzel', serif; user-select: none; }
        
        /* UI OVERLAY */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .karma-box { 
            background: rgba(20, 20, 30, 0.8); border: 1px solid #FFD700; 
            padding: 10px 20px; border-radius: 30px; color: #FFD700; 
            backdrop-filter: blur(10px); pointer-events: auto;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        
        .controls { pointer-events: auto; display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
        .btn-action {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; padding: 12px 24px; border-radius: 50px; cursor: pointer;
            font-family: 'Cinzel', serif; text-transform: uppercase; font-weight: bold;
            transition: 0.3s; backdrop-filter: blur(5px);
        }
        .btn-action:active { background: #FFD700; color: #000; transform: scale(0.95); }

        /* LOADING SCREEN */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid #333; border-top: 3px solid #FFD700;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="color: #666; letter-spacing: 3px;">ENTERING SANCTUM...</div>
    </div>

    <div id="ui-layer">
        <div class="hud-top">
            <div style="color: rgba(255,255,255,0.5);">LVL 1: SEEKER</div>
            <div class="karma-box">🕉️ <span id="score">0</span></div>
        </div>
        <div class="controls">
            <button class="btn-action" onclick="Game.resetView()">Reset View</button>
            <button class="btn-action" onclick="Game.toggleAudio()">🔇 / 🔊</button>
        </div>
    </div>

    <div id="world"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- GAME ENGINE STATE ---
        const State = {
            score: 0,
            isPouring: false,
            audioEnabled: false
        };

        // --- AUDIO SYNTHESIZER ---
        const AudioSys = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playBell() {
                if (!State.audioEnabled) return;
                this.init();
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                // Bell harmonics
                [500, 1000, 1500].forEach(f => {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.1, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 3);
                    o.connect(g); g.connect(this.ctx.destination);
                    o.start(t); o.stop(t + 3);
                });
            },
            playWater() {
                if (!State.audioEnabled) return;
                this.init();
                const bufferSize = this.ctx.sampleRate * 2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 800;
                
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 2);

                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                noise.start();
            }
        };

        // --- 3D SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.05);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('world').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2; // Don't go below ground
        controls.minDistance = 3;
        controls.maxDistance = 10;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
        scene.add(ambientLight);

        const flameLight = new THREE.PointLight(0xffaa00, 5, 10);
        flameLight.position.set(0, 1, 2);
        flameLight.castShadow = true;
        scene.add(flameLight);

        const topLight = new THREE.SpotLight(0xffffff, 5);
        topLight.position.set(0, 8, 0);
        topLight.angle = Math.PI / 6;
        topLight.penumbra = 0.5;
        topLight.castShadow = true;
        scene.add(topLight);

        // --- OBJECTS (PROCEDURAL GENERATION) ---
        
        // 1. Floor
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x111111, roughness: 0.5, metalness: 0.5 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 2. Shivling Base (Yoni)
        const yoniGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.4, 32);
        const blackStone = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.2, metalness: 0.8 });
        const yoni = new THREE.Mesh(yoniGeo, blackStone);
        yoni.position.y = 0.2;
        yoni.castShadow = true; yoni.receiveShadow = true;
        scene.add(yoni);

        // Spout
        const spoutGeo = new THREE.BoxGeometry(0.8, 0.3, 1.5);
        const spout = new THREE.Mesh(spoutGeo, blackStone);
        spout.position.set(0, 0.2, 1.2);
        scene.add(spout);

        // 3. Lingam
        const lingamGeo = new THREE.CapsuleGeometry(0.6, 1.2, 4, 16);
        const lingam = new THREE.Mesh(lingamGeo, blackStone);
        lingam.position.y = 1;
        lingam.castShadow = true;
        scene.add(lingam);

        // Tripundra (Three Lines)
        const tripundraGroup = new THREE.Group();
        const lineGeo = new THREE.BoxGeometry(0.6, 0.05, 0.05); // Curved manually via position
        const ashMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });
        
        for(let i=0; i<3; i++) {
            const line = new THREE.Mesh(lineGeo, ashMat);
            line.position.set(0, 1.2 + (i*0.1), 0.55);
            // Simple curve simulation
            tripundraGroup.add(line);
        }
        const dotGeo = new THREE.SphereGeometry(0.06);
        const redMat = new THREE.MeshBasicMaterial({color: 0xff0000});
        const dot = new THREE.Mesh(dotGeo, redMat);
        dot.position.set(0, 1.3, 0.58);
        tripundraGroup.add(dot);
        scene.add(tripundraGroup);


        // 4. Kalash (Pot) - INTERACTIVE
        const potGeo = new THREE.SphereGeometry(0.5, 32, 16);
        const copperMat = new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: 0.6, roughness: 0.3 });
        const pot = new THREE.Mesh(potGeo, copperMat);
        pot.position.set(0, 3.5, 0);
        pot.castShadow = true;
        pot.userData = { type: 'pot' }; // Tag for raycaster
        scene.add(pot);

        // Rope
        const ropeGeo = new THREE.CylinderGeometry(0.02, 0.02, 2);
        const rope = new THREE.Mesh(ropeGeo, new THREE.MeshBasicMaterial({color:0x888888}));
        rope.position.set(0, 4.5, 0);
        scene.add(rope);

        // 5. Bell - INTERACTIVE
        const bellGeo = new THREE.ConeGeometry(0.4, 0.6, 32, 1, true);
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.9, roughness: 0.2 });
        const bell = new THREE.Mesh(bellGeo, goldMat);
        bell.position.set(-2, 3, 0);
        bell.userData = { type: 'bell' };
        scene.add(bell);
        
        const bellRope = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2), new THREE.MeshBasicMaterial({color:0x888888}));
        bellRope.position.set(-2, 4.3, 0);
        scene.add(bellRope);


        // --- PARTICLE SYSTEMS ---
        
        // Water System
        const waterCount = 200;
        const waterGeo = new THREE.BufferGeometry();
        const waterPos = new Float32Array(waterCount * 3);
        waterGeo.setAttribute('position', new THREE.BufferAttribute(waterPos, 3));
        const waterMat = new THREE.PointsMaterial({ color: 0x00aaff, size: 0.05, transparent: true, opacity: 0.6 });
        const waterSys = new THREE.Points(waterGeo, waterMat);
        scene.add(waterSys);
        
        // Init Water Positions (Hidden)
        for(let i=0; i<waterCount*3; i+=3) waterPos[i+1] = 100; // Hide way up

        // --- INTERACTION LOGIC (Raycaster) ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function onPointerClick( event ) {
            pointer.x = ( event.clientX / window.innerWidth ) * 2 - 1;
            pointer.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

            raycaster.setFromCamera( pointer, camera );
            const intersects = raycaster.intersectObjects( scene.children );

            if ( intersects.length > 0 ) {
                const obj = intersects[0].object;
                
                if (obj.userData.type === 'pot') {
                    startAbhishekam();
                }
                if (obj.userData.type === 'bell') {
                    ringBell(obj);
                }
            }
        }

        function startAbhishekam() {
            if(State.isPouring) return;
            State.isPouring = true;
            AudioSys.playWater();
            
            // Tilt Pot Animation
            let tilt = 0;
            const tiltInterval = setInterval(() => {
                tilt += 0.05;
                pot.rotation.z = Math.sin(tilt) * 0.5;
                if(tilt > 3) {
                    clearInterval(tiltInterval);
                    pot.rotation.z = 0;
                    State.isPouring = false;
                }
            }, 16);

            // Activate Particles
            let pIdx = 0;
            const flowInterval = setInterval(() => {
                if(!State.isPouring) { clearInterval(flowInterval); return; }
                // Reset a batch of particles to the pot mouth
                for(let k=0; k<10; k++) {
                    const i = (pIdx + k) % waterCount;
                    waterPos[i*3] = (Math.random() - 0.5) * 0.1; // x
                    waterPos[i*3 + 1] = 3.2; // y (pot height)
                    waterPos[i*3 + 2] = (Math.random() - 0.5) * 0.1; // z
                }
                pIdx += 10;
                State.score += 1;
                document.getElementById('score').innerText = State.score;
            }, 50);
        }

        function ringBell(bellMesh) {
            AudioSys.playBell();
            let swing = 0;
            const swingInterval = setInterval(() => {
                swing += 0.2;
                bellMesh.rotation.x = Math.sin(swing) * 0.5;
                if(swing > 6) {
                    clearInterval(swingInterval);
                    bellMesh.rotation.x = 0;
                }
            }, 16);
        }

        window.addEventListener( 'click', onPointerClick );

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame( animate );
            controls.update();

            // Animate Flame Light (Flicker)
            flameLight.intensity = 2 + Math.random() * 2;

            // Animate Water Particles
            const positions = waterSys.geometry.attributes.position.array;
            for(let i=1; i<positions.length; i+=3) {
                if(positions[i] < 100) { // If active
                    positions[i] -= 0.1; // Fall down
                    if(positions[i] < 1) positions[i] = 100; // Reset if hits lingam
                }
            }
            waterSys.geometry.attributes.position.needsUpdate = true;

            renderer.render( scene, camera );
        }

        // --- GAME CONTROLLER ---
        window.Game = {
            resetView: () => {
                camera.position.set(0, 3, 6);
                controls.target.set(0, 1, 0);
            },
            toggleAudio: () => {
                State.audioEnabled = !State.audioEnabled;
                AudioSys.init(); // Unlock context
                alert(State.audioEnabled ? "Audio ON" : "Audio OFF");
            }
        };

        // Remove Loader
        setTimeout(() => document.getElementById('loader').style.opacity = 0, 1500);
        setTimeout(() => document.getElementById('loader').style.display = 'none', 2500);

        animate();

    </script>
</body>
</html>
