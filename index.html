<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShivaOS: Ananda</title>
    <meta name="theme-color" content="#0a0a12">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;500;700&display=swap');

        :root {
            --bg: #0a0a12;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --primary: #8A2BE2; /* Deep Purple */
            --accent: #00E5FF; /* Cyan */
            --gold: #FFD700;
            --success: #00ff9d;
            --gradient-main: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-fire: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-water: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            --nav-height: 85px;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }

        body {
            margin: 0; background: var(--bg); color: #fff;
            font-family: 'Outfit', sans-serif; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% -20%, #2a0845, #000000);
        }

        /* --- 1. SPLASH SCREEN --- */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }
        .splash-om {
            font-size: 6rem; background: var(--gradient-fire); -webkit-background-clip: text; color: transparent;
            animation: float 3s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
        }
        .splash-text {
            margin-top: 20px; font-family: 'Cinzel'; letter-spacing: 5px; color: #fff; opacity: 0;
            animation: fadeInUp 1s ease forwards 0.5s;
        }
        .loader-dots span {
            display: inline-block; width: 8px; height: 8px; background: var(--accent); border-radius: 50%;
            margin: 0 4px; animation: bounce 0.6s infinite alternate;
        }
        .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

        /* --- 2. HEADER & SOUND TOGGLE --- */
        #header {
            position: fixed; top: 0; width: 100%; height: 60px; z-index: 100;
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            background: rgba(10,10,15,0.8); backdrop-filter: blur(20px); border-bottom: var(--glass-border);
        }
        .logo { font-family: 'Cinzel'; font-weight: 700; background: linear-gradient(to right, #fff, #aaa); -webkit-background-clip: text; color: transparent; }
        .snd-toggle {
            width: 40px; height: 40px; border-radius: 50%; background: var(--glass);
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s;
        }
        .snd-toggle.active { background: var(--success); color: #000; box-shadow: 0 0 15px var(--success); }

        /* --- 3. UI COMPONENTS --- */
        #viewport { flex: 1; overflow-y: auto; padding: 80px 20px 100px 20px; scroll-behavior: smooth; }
        
        .card {
            background: var(--glass); border: var(--glass-border); border-radius: 24px; padding: 20px;
            margin-bottom: 20px; transition: transform 0.3s, box-shadow 0.3s; position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-5px) scale(1.01); box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.3); }
        .card-h { font-family: 'Cinzel'; font-size: 1.1rem; color: #fff; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-grad {
            width: 100%; padding: 15px; border: none; border-radius: 16px; font-weight: bold; color: #fff;
            background: var(--gradient-main); cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
        }
        .btn-grad:active { transform: scale(0.95); filter: brightness(1.2); }
        .btn-grad::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shine 3s infinite;
        }

        /* --- 4. PARTICLES --- */
        .particle {
            position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 9999;
            animation: fall 1s ease-in forwards;
        }

        /* --- ANIMATIONS --- */
        @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-20px);} }
        @keyframes glow { from{text-shadow:0 0 10px var(--primary);} to{text-shadow:0 0 30px var(--accent);} }
        @keyframes fadeInUp { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
        @keyframes bounce { to{transform:translateY(-10px);} }
        @keyframes shine { 0%{left:-100%;} 20%{left:100%;} 100%{left:100%;} }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        @keyframes pulse-ring { 0%{box-shadow:0 0 0 0 rgba(255,215,0,0.7);} 70%{box-shadow:0 0 0 20px rgba(255,215,0,0);} 100%{box-shadow:0 0 0 0 rgba(255,215,0,0);} }

        /* --- MODULE: HOME --- */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-box {
            background: rgba(255,255,255,0.03); padding: 20px; border-radius: 16px; text-align: center;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s;
        }
        .stat-box:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .stat-val { font-size: 2rem; font-weight: 700; background: var(--gradient-water); -webkit-background-clip: text; color: transparent; }

        /* --- MODULE: SANCTUM --- */
        .altar-3d { height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .lingam { 
            width: 100px; height: 140px; background: radial-gradient(circle at 30% 30%, #444, #000); 
            border-radius: 50px 50px 30px 30px; box-shadow: 0 20px 50px #000; position: relative; z-index: 5;
        }
        .tripundra { position: absolute; top: 40px; width: 100%; text-align: center; opacity: 0.8; }
        .om-glow { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            font-size: 8rem; opacity: 0.1; color: var(--gold); pointer-events: none; transition: 0.3s;
        }
        .pouring .om-glow { opacity: 0.6; text-shadow: 0 0 50px var(--accent); }
        
        /* --- MODULE: AHARA --- */
        .diet-toggle { display: flex; background: #222; border-radius: 12px; padding: 5px; margin-bottom: 20px; }
        .dt-btn { flex: 1; padding: 12px; text-align: center; border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: 0.3s; color: #888; }
        .dt-btn.active { background: var(--success); color: #000; font-weight: bold; box-shadow: 0 5px 15px rgba(0,255,157,0.3); }

        /* --- DOCK --- */
        #dock {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
            background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); border-top: var(--glass-border);
            z-index: 1000; padding-bottom: var(--safe-bottom);
            overflow-x: auto; white-space: nowrap; -ms-overflow-style: none; scrollbar-width: none;
        }
        .dock-content { display: flex; padding: 0 15px; height: 100%; align-items: center; gap: 10px; }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-width: 70px; height: 60px; color: #666; border-radius: 12px; transition: 0.3s; font-size: 0.7rem; font-weight: 600;
        }
        .nav-icon { font-size: 1.5rem; margin-bottom: 4px; transition: 0.3s; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: #fff; }
        .nav-item.active .nav-icon { transform: translateY(-3px); color: var(--accent); text-shadow: 0 0 10px var(--accent); }

    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-om">🕉️</div>
        <div class="splash-text">SHIVA SADHANA</div>
        <div class="loader-dots" style="margin-top: 20px;"><span></span><span></span><span></span></div>
    </div>

    <div id="header">
        <div class="logo">MAHA KAILASH</div>
        <div class="snd-toggle" onclick="Sound.toggle()" id="mute-btn">🔇</div>
    </div>

    <div id="viewport">
        <div id="view-container"></div>
    </div>

    <div id="dock">
        <div class="dock-content" id="dock-items">
            </div>
    </div>

    <script>
        /* --- 🔊 ADVANCED AUDIO ENGINE (Web Audio API) --- */
        const Sound = {
            ctx: null,
            muted: true,
            init() { 
                if(!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.master = this.ctx.createGain();
                    this.master.connect(this.ctx.destination);
                }
            },
            toggle() {
                this.init();
                this.muted = !this.muted;
                const btn = document.getElementById('mute-btn');
                btn.innerText = this.muted ? "🔇" : "🔊";
                btn.classList.toggle('active');
                if(!this.muted) {
                    this.ctx.resume();
                    this.play('click');
                }
            },
            play(type) {
                if(this.muted || !this.ctx) return;
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.connect(g); g.connect(this.master);

                if(type === 'click') {
                    osc.frequency.setValueAtTime(800, t);
                    osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
                    g.gain.setValueAtTime(0.1, t);
                    g.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                } 
                else if (type === 'karma') { // 528 Hz Healing
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(528, t);
                    g.gain.setValueAtTime(0, t);
                    g.gain.linearRampToValueAtTime(0.3, t + 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, t + 1.5);
                    osc.start(t); osc.stop(t + 1.5);
                }
                else if (type === 'om') { // 136.1 Hz
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(136.1, t);
                    g.gain.setValueAtTime(0, t);
                    g.gain.linearRampToValueAtTime(0.4, t + 1);
                    g.gain.linearRampToValueAtTime(0, t + 4);
                    osc.start(t); osc.stop(t + 4);
                }
                else if (type === 'water') {
                    // White noise buffer
                    const bufferSize = this.ctx.sampleRate * 2;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass'; filter.frequency.value = 400;
                    noise.connect(filter); filter.connect(g);
                    g.gain.setValueAtTime(0.5, t);
                    g.gain.exponentialRampToValueAtTime(0.01, t + 2);
                    noise.start(t); noise.stop(t + 2);
                    return; // Return early as osc is not used
                }
            }
        };

        /* --- ✨ VISUAL FX --- */
        const FX = {
            confetti() {
                for(let i=0; i<30; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.left = Math.random() * 100 + 'vw';
                    p.style.top = '-10px';
                    p.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
                    document.body.appendChild(p);
                    setTimeout(()=>p.remove(), 1000);
                }
            }
        };

        /* --- 📱 APP LOGIC --- */
        const App = {
            points: 0,
            
            init() {
                // Remove Splash
                setTimeout(() => {
                    document.getElementById('splash').style.opacity = 0;
                    setTimeout(() => document.getElementById('splash').style.display = 'none', 1000);
                }, 2500);

                this.renderDock();
                this.route('home');
            },

            addPoints(n) {
                this.points += n;
                Sound.play('karma');
                if(n >= 10) FX.confetti();
                // Update specific UI if visible
                const el = document.getElementById('karma-disp');
                if(el) el.innerText = this.points;
            },

            route(id) {
                Sound.play('click');
                const container = document.getElementById('view-container');
                container.innerHTML = Views[id]();
                
                // Active Dock State
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const activeNav = document.getElementById(`nav-${id}`);
                if(activeNav) activeNav.classList.add('active');

                // Init Logic for specific views
                if(id === 'home') this.initCal();
            },

            renderDock() {
                const tabs = [
                    {id:'home', i:'📅', n:'Home'}, {id:'sanctum', i:'🕉️', n:'Puja'},
                    {id:'ahara', i:'🥗', n:'Diet'}, {id:'sadhana', i:'🧘', n:'Tools'},
                    {id:'media', i:'🎵', n:'Media'}, {id:'prasad', i:'🏆', n:'Stats'}
                ];
                const d = document.getElementById('dock-items');
                d.innerHTML = tabs.map(t => `
                    <div class="nav-item" id="nav-${t.id}" onclick="App.route('${t.id}')">
                        <div class="nav-icon">${t.i}</div><div>${t.n}</div>
                    </div>
                `).join('');
            },

            // Calendar Logic
            initCal() {
                const g = document.getElementById('cal-grid');
                if(!g) return;
                g.innerHTML = '';
                for(let i=1; i<=30; i++) {
                    const isMon = new Date(2025, 0, i).getDay() === 1;
                    g.innerHTML += `<div class="cal-day" style="padding:10px; background:${isMon?'rgba(0,255,157,0.1)':'rgba(255,255,255,0.05)'}; border:${isMon?'1px solid var(--success)':'none'}; border-radius:8px; text-align:center;">${i}</div>`;
                }
            }
        };

        /* --- 📄 VIEW TEMPLATES --- */
        const Views = {
            home: () => `
                <div class="card" style="background:var(--gradient-main);">
                    <div class="card-h">Pranam, Devotee</div>
                    <div class="stat-grid">
                        <div class="stat-box"><div class="stat-val" id="karma-disp">${App.points}</div><div style="font-size:0.8rem; opacity:0.8;">Karma Pts</div></div>
                        <div class="stat-box"><div class="stat-val">3</div><div style="font-size:0.8rem; opacity:0.8;">Day Streak</div></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-h">Panchang Calendar</div>
                    <div id="cal-grid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px;"></div>
                    <button class="btn-grad" style="margin-top:15px;" onclick="alert('Alarm Set!'); Sound.play('success');">⏰ Set Puja Alarm</button>
                </div>
            `,
            sanctum: () => `
                <div class="card" style="text-align:center; height:70vh; display:flex; flex-direction:column; justify-content:center;">
                    <div class="card-h" style="justify-content:center;">Abhishekam</div>
                    <div class="altar-3d" id="altar-area">
                        <div class="om-glow">🕉️</div>
                        <div class="lingam"><div class="tripundra" style="color:rgba(255,255,255,0.8); font-size:2rem;">•••</div></div>
                    </div>
                    <button class="btn-grad" onclick="
                        Sound.play('water'); 
                        document.getElementById('altar-area').classList.add('pouring');
                        App.addPoints(5);
                        setTimeout(()=>document.getElementById('altar-area').classList.remove('pouring'), 2000);
                    ">💧 Pour Gangajal</button>
                </div>
            `,
            ahara: () => `
                <div class="card">
                    <div class="card-h">Meal Planner</div>
                    <div class="diet-toggle">
                        <div class="dt-btn active" onclick="this.classList.add('active'); this.nextElementSibling.classList.remove('active'); document.getElementById('menu').innerHTML='Fruits, Milk, Sabudana'; Sound.play('click');">Satvik</div>
                        <div class="dt-btn" onclick="this.classList.add('active'); this.previousElementSibling.classList.remove('active'); document.getElementById('menu').innerHTML='Water, Bilva, Air'; Sound.play('click');">Nirjala</div>
                    </div>
                    <div id="menu" style="font-size:1.2rem; text-align:center; padding:20px; border:1px dashed rgba(255,255,255,0.2); border-radius:12px;">Fruits, Milk, Sabudana</div>
                </div>
            `,
            sadhana: () => `
                <div class="card" style="text-align:center;">
                    <div class="card-h" style="justify-content:center;">Meditation</div>
                    <div style="font-size:4rem; margin:20px 0; animation:glow 3s infinite;">🕉️</div>
                    <button class="btn-grad" onclick="Sound.play('om'); App.addPoints(10);">Start Dhyan (136.1Hz)</button>
                </div>
                <div class="card">
                    <div class="card-h">Recording</div>
                    <div class="loader-dots" style="text-align:center; opacity:0.5;"><span></span><span></span><span></span><span></span></div>
                    <button class="btn-grad" style="background:#333; margin-top:15px;" onclick="this.style.background='red'; this.innerText='Recording...';">🎙️ Record Chant</button>
                </div>
            `,
            media: () => `
                <div class="card" style="background:linear-gradient(45deg, #1db954, #191414);">
                    <div class="card-h">Spotify Playlist</div>
                    <button class="btn-grad" style="background:#000;" onclick="window.open('http://spotify.com')">🎧 Open Chants</button>
                </div>
                <div class="card">
                    <div class="card-h">Live Darshan</div>
                    <div style="aspect-ratio:16/9; background:#000; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#888;">Video Feed Loading...</div>
                </div>
            `,
            prasad: () => `
                <div class="card">
                    <div class="card-h">Your Journey</div>
                    <div style="text-align:center;">
                        <div style="font-size:4rem; font-weight:bold; color:var(--gold); text-shadow:0 0 20px var(--gold);">${App.points}</div>
                        <div>Total Karma Points</div>
                    </div>
                </div>
            `
        };

        // Initialize App
        App.init();

    </script>
</body>
</html>
