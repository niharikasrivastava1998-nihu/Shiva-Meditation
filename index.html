<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KailashOS</title>
    <meta name="theme-color" content="#000000">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Manrope:wght@300;500;700&display=swap');

        :root {
            --bg: #000000;
            --surface: #0f0f0f;
            --gold: #D4AF37;
            --gold-dim: #8a7326;
            --rudra: #800000;
            --accent: #3b82f6;
            --font-display: 'Cinzel', serif;
            --font-ui: 'Manrope', sans-serif;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            margin: 0; background: var(--bg); color: #fff;
            font-family: var(--font-ui); height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- 1. THE HIDDEN ENTRY (SCROLL LOCK) --- */
        #intro-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
            background: radial-gradient(circle at center, #1a1a1a, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow-y: scroll; /* Allow scroll event */
            scroll-behavior: smooth;
        }
        
        .intro-content {
            height: 150vh; /* Taller than screen to force scroll */
            width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 40vh;
        }

        .trishul-glyph {
            font-size: 6rem; color: var(--gold); filter: drop-shadow(0 0 40px var(--gold));
            opacity: 1; transition: opacity 0.5s;
        }
        
        .scroll-hint {
            margin-top: 20px; font-family: var(--font-display); letter-spacing: 4px; font-size: 0.8rem;
            color: #666; animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(10px);} }

        /* --- 2. MAIN OS UI --- */
        #os-layer {
            opacity: 0; pointer-events: none; transition: opacity 1s var(--ease);
            height: 100%; display: flex; flex-direction: column;
        }
        #os-layer.active { opacity: 1; pointer-events: all; }

        /* VIEWS */
        .viewport { flex: 1; position: relative; overflow: hidden; }
        .view {
            position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
            background: #000; display: none; opacity: 0; transform: scale(0.95);
            transition: 0.5s var(--ease); padding-bottom: 100px;
        }
        .view.active { display: block; opacity: 1; transform: scale(1); }

        /* --- VIEW: JAPA ENGINE (The Bead Logic) --- */
        #view-japa { background: radial-gradient(circle at 50% 30%, #1a0b0b, #000); }
        
        .idol-selector {
            display: flex; gap: 20px; padding: 20px; overflow-x: auto;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .idol-chip {
            min-width: 80px; height: 100px; background: rgba(255,255,255,0.05); border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid transparent; transition: 0.3s;
        }
        .idol-chip.active { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); }
        .idol-img { font-size: 2rem; margin-bottom: 5px; }
        .idol-lbl { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }

        .bead-string-container {
            height: 300px; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; margin-top: 20px;
        }
        .mala-string {
            position: absolute; width: 120%; height: 2px; background: #555;
            top: 50%; left: -10%; z-index: 1;
        }
        /* The Beads */
        .bead {
            width: 60px; height: 60px; background: url('https://www.transparenttextures.com/patterns/wood-pattern.png'), radial-gradient(circle at 30% 30%, #8B4513, #3e1e05);
            border-radius: 50%; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 2;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s var(--ease), left 0.2s var(--ease), opacity 0.2s;
            cursor: pointer; border: 1px solid #5c3a1e;
        }
        /* Bead States for Animation */
        .bead.current { left: 50%; transform: translate(-50%, -50%) scale(1.2); z-index: 10; border-color: var(--gold); }
        .bead.next { left: 80%; transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
        .bead.prev { left: 20%; transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
        .bead.exit { left: -10%; opacity: 0; }
        .bead.enter { left: 110%; opacity: 0; }

        .mantra-hud { text-align: center; margin-top: 10px; }
        .counter-big { font-family: var(--font-display); font-size: 4rem; color: var(--gold); line-height: 1; }
        .mantra-text { font-family: var(--font-display); color: #fff; font-size: 1.2rem; margin-top: 10px; opacity: 0; animation: fadeUp 0.5s forwards; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        /* --- VIEW: PANCHANG (Yearly Calendar) --- */
        #view-panchang { padding: 20px; background: #050505; }
        
        .year-header { font-family: var(--font-display); font-size: 2rem; color: var(--gold); margin-bottom: 20px; }
        
        .months-carousel {
            display: flex; gap: 20px; overflow-x: auto; padding-bottom: 30px;
            scroll-snap-type: x mandatory;
        }
        .month-card {
            min-width: 300px; background: #111; border: 1px solid #222; border-radius: 16px;
            padding: 20px; scroll-snap-align: center;
        }
        .m-title { text-align: center; color: #fff; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-head { color: #555; font-size: 0.7rem; padding-bottom: 5px; }
        .cal-day { 
            font-size: 0.8rem; padding: 8px 0; color: #888; border-radius: 4px;
        }
        .cal-day.somvar { color: #4CAF50; background: rgba(76,175,80,0.1); font-weight: bold; }
        .cal-day.today { background: var(--gold); color: #000; font-weight: bold; box-shadow: 0 0 10px var(--gold-dim); }

        /* --- NAVIGATION --- */
        .nav-island {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(20,20,20,0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 40px;
            padding: 10px 25px; display: flex; gap: 25px; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-icon {
            font-size: 1.5rem; opacity: 0.5; transition: 0.3s; cursor: pointer;
            position: relative;
        }
        .nav-icon.active { opacity: 1; transform: translateY(-5px); }
        .nav-icon.active::after {
            content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background: var(--gold); border-radius: 50%;
        }

    </style>
</head>
<body>

    <div id="intro-layer" onscroll="checkScroll()">
        <div class="intro-content">
            <div class="trishul-glyph" id="glyph">Ψ</div>
            <div class="scroll-hint">SCROLL TO ASCEND</div>
        </div>
    </div>

    <div id="os-layer">
        
        <div class="viewport">
            
            <div id="view-japa" class="view active">
                <div style="padding:20px;">
                    <div style="font-family:var(--font-display); color:var(--gold); text-align:center;">Mantra Yoga</div>
                </div>

                <div class="idol-selector">
                    <div class="idol-chip active" onclick="Japa.setDeity('shiva', this)">
                        <div class="idol-img">🔱</div><div class="idol-lbl">Shiva</div>
                    </div>
                    <div class="idol-chip" onclick="Japa.setDeity('ganesh', this)">
                        <div class="idol-img">🐘</div><div class="idol-lbl">Ganesh</div>
                    </div>
                    <div class="idol-chip" onclick="Japa.setDeity('devi', this)">
                        <div class="idol-img">🦁</div><div class="idol-lbl">Devi</div>
                    </div>
                    <div class="idol-chip" onclick="Japa.setDeity('hanuman', this)">
                        <div class="idol-img">🐵</div><div class="idol-lbl">Hanuman</div>
                    </div>
                </div>

                <div class="bead-string-container" onclick="Japa.pullBead()">
                    <div class="mala-string"></div>
                    <div class="bead prev" id="b-prev"></div>
                    <div class="bead current" id="b-curr"></div>
                    <div class="bead next" id="b-next"></div>
                    <div class="bead enter" id="b-ent"></div>
                </div>

                <div class="mantra-hud">
                    <div class="counter-big" id="jap-count">0</div>
                    <div class="mantra-text" id="mantra-display">Om Namah Shivaya</div>
                    <p style="color:#666; font-size:0.8rem; margin-top:20px;">Tap Beads to Count</p>
                </div>
            </div>

            <div id="view-panchang" class="view">
                <div class="year-header">Year 2025</div>
                <div class="months-carousel" id="cal-container">
                    </div>
                <div style="text-align:center; color:#666; font-size:0.8rem; margin-top:20px;">
                    Swipe horizontal to see months.<br>Green days are Somvar (Sacred).
                </div>
            </div>

            <div id="view-yatra" class="view" style="background:#111; padding:20px;">
                <div style="font-family:var(--font-display); color:var(--gold); font-size:1.5rem; margin-bottom:20px;">Temple Locator</div>
                
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <input type="text" id="city" placeholder="City (e.g. Ujjain)" style="background:#222; border:1px solid #333; color:#fff; padding:15px; border-radius:8px; flex:1;">
                    <button onclick="locateTemples()" style="background:var(--gold); border:none; padding:0 20px; border-radius:8px; font-weight:bold;">GO</button>
                </div>

                <iframe id="gmap" width="100%" height="400" style="border:0; border-radius:16px;" loading="lazy" allowfullscreen></iframe>
            </div>

        </div>

        <div class="nav-island">
            <div class="nav-icon active" onclick="switchView('japa', this)">📿</div>
            <div class="nav-icon" onclick="switchView('panchang', this)">📅</div>
            <div class="nav-icon" onclick="switchView('yatra', this)">📍</div>
        </div>

    </div>

    <script>
        /* --- 1. SCROLL ENTRY LOGIC --- */
        function checkScroll() {
            const el = document.getElementById('intro-layer');
            const glyph = document.getElementById('glyph');
            const scroll = el.scrollTop;
            
            // Fade glyph on scroll
            glyph.style.opacity = 1 - (scroll / 300);
            
            if (scroll > 200) {
                // Unlock App
                el.style.opacity = 0;
                el.style.pointerEvents = 'none';
                document.getElementById('os-layer').classList.add('active');
            }
        }

        /* --- 2. VIRTUAL MALA ENGINE (PHYSICS) --- */
        const Japa = {
            count: 0,
            mantras: {
                'shiva': 'Om Namah Shivaya',
                'ganesh': 'Om Gam Ganapataye Namaha',
                'devi': 'Om Dum Durgaye Namaha',
                'hanuman': 'Om Hanumate Namaha'
            },
            currentDeity: 'shiva',
            
            setDeity(key, el) {
                this.currentDeity = key;
                document.getElementById('mantra-display').innerText = this.mantras[key];
                document.querySelectorAll('.idol-chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
                this.count = 0;
                document.getElementById('jap-count').innerText = 0;
            },

            pullBead() {
                // 1. Update Logic
                this.count++;
                document.getElementById('jap-count').innerText = this.count;
                
                // 2. Haptics (Vibrate Phone)
                if(navigator.vibrate) navigator.vibrate(15); // Short, sharp click feel

                // 3. Animation Sequence
                const prev = document.getElementById('b-prev');
                const curr = document.getElementById('b-curr');
                const next = document.getElementById('b-next');
                const ent = document.getElementById('b-ent');

                // Shift classes
                prev.className = 'bead exit'; // Old prev leaves
                curr.className = 'bead prev'; // Current becomes prev
                next.className = 'bead current'; // Next becomes current
                ent.className = 'bead next'; // Entering becomes next

                // Reset DOM after animation (200ms) to allow infinite loop
                setTimeout(() => {
                    // Create a new "Entering" bead to replace the one that moved up
                    const newBead = document.createElement('div');
                    newBead.className = 'bead enter';
                    newBead.id = 'b-temp'; 
                    document.querySelector('.bead-string-container').appendChild(newBead);

                    // Recycle elements (Reset IDs)
                    // In a real React app we'd use state, here we cheat with DOM swapping for performance
                    prev.remove(); // Remove the exited one
                    curr.id = 'b-prev';
                    next.id = 'b-curr';
                    ent.id = 'b-next';
                    newBead.id = 'b-ent';
                }, 200);
            }
        };

        /* --- 3. CALENDAR ENGINE (ALGORITHM) --- */
        function initCalendar() {
            const container = document.getElementById('cal-container');
            const year = 2025;
            const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
            
            const today = new Date();

            months.forEach((mName, mIndex) => {
                const card = document.createElement('div');
                card.className = 'month-card';
                
                let html = `<div class="m-title">${mName}</div>
                            <div class="cal-grid">
                                <div class="cal-head">S</div><div class="cal-head">M</div><div class="cal-head">T</div><div class="cal-head">W</div><div class="cal-head">T</div><div class="cal-head">F</div><div class="cal-head">S</div>`;
                
                // Days logic
                const daysInMonth = new Date(year, mIndex + 1, 0).getDate();
                const firstDay = new Date(year, mIndex, 1).getDay(); // 0 = Sun
                
                // Empty slots
                for(let i=0; i<firstDay; i++) html += `<div></div>`;
                
                // Days
                for(let d=1; d<=daysInMonth; d++) {
                    const dateObj = new Date(year, mIndex, d);
                    let classes = 'cal-day';
                    
                    // Somvar Check (Monday = 1)
                    if(dateObj.getDay() === 1) classes += ' somvar';
                    
                    // Today Check
                    if(d === today.getDate() && mIndex === today.getMonth() && year === today.getFullYear()) classes += ' today';
                    
                    html += `<div class="${classes}">${d}</div>`;
                }
                
                html += `</div>`;
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        /* --- 4. MAPS & NAV --- */
        function locateTemples() {
            const city = document.getElementById('city').value;
            if(!city) return;
            const q = `Shiva Temples in ${city}`;
            document.getElementById('gmap').src = `https://www.google.com/maps?q=${encodeURIComponent(q)}&output=embed`;
        }

        function switchView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-'+id).classList.add('active');
            document.querySelectorAll('.nav-icon').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
        }

        // Init
        initCalendar();

    </script>
</body>
</html>
