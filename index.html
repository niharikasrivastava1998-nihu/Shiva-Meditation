<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShivaOS: Pure</title>
    <meta name="theme-color" content="#000000">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;500;700&display=swap');

        :root {
            --bg: #050505;
            --glass: rgba(20, 20, 25, 0.95);
            --gold: #FFD700;
            --orange: #FF9800; /* For Panchang */
            --rudra: #ff4444;
            --chakra: #00e5ff;
            --text: #ffffff;
            --nav-height: 85px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Outfit', sans-serif; height: 100vh; overflow: hidden; }

        /* --- ENTRY GATE --- */
        #gate {
            position: fixed; inset: 0; z-index: 9999; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s; cursor: pointer;
        }
        .earth-btn {
            width: 140px; height: 140px; border-radius: 50%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png'), radial-gradient(circle at 30% 30%, #4facfe, #000);
            box-shadow: 0 0 80px rgba(79, 172, 254, 0.4); animation: float 6s ease-in-out infinite;
            display: flex; align-items: center; justify-content: center; font-size: 4rem;
        }
        @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-20px);} }

        /* --- OS SHELL --- */
        #os-ui { opacity: 0; transition: opacity 1s; height: 100%; display: flex; flex-direction: column; background: linear-gradient(to bottom, #100c14, #000); }
        
        .status-bar {
            height: calc(30px + var(--safe-top)); padding-top: var(--safe-top);
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            background: rgba(255,255,255,0.05); font-size: 0.8rem;
        }

        #home-screen {
            flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px;
            display: grid; grid-template-columns: repeat(4, 1fr); align-content: flex-start; gap: 20px 10px;
        }
        
        .app-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; animation: popIn 0.5s forwards; opacity: 0; transform: scale(0.5); }
        .icon-box {
            width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .icon-box:active { transform: scale(0.9); }
        .icon-lbl { font-size: 0.7rem; color: #ddd; font-weight: 500; }
        @keyframes popIn { to { opacity: 1; transform: scale(1); } }

        /* --- APP WINDOW --- */
        #app-window {
            position: fixed; inset: 0; background: #050505; z-index: 500; transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column;
        }
        #app-window.open { transform: translateY(0); }
        
        .app-header {
            height: calc(60px + var(--safe-top)); padding-top: var(--safe-top);
            display: flex; align-items: center; padding-left: 15px; border-bottom: 1px solid #222;
            background: rgba(20,20,20,0.98);
        }
        .win-body { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }

        /* --- COMPONENTS --- */
        .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 20px; margin-bottom: 15px; position: relative; }
        .card-h { font-family: 'Cinzel'; color: var(--gold); font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .btn-gold { width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 12px; color: #000; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-glass { padding: 8px 16px; background: rgba(255,255,255,0.1); border-radius: 20px; font-size: 0.8rem; cursor: pointer; color: #ccc; border: 1px solid #333; }
        .input-field { width: 100%; padding: 12px; background: #222; border: 1px solid #333; color: #fff; border-radius: 10px; }

        /* 1. PANCHANG (Orange/Gold Theme) */
        .panchang-card { background: linear-gradient(135deg, #2a1a00, #000); border: 1px solid var(--orange); }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .cal-day { padding: 12px 0; background: #1a1a1a; border-radius: 8px; text-align: center; font-size: 0.8rem; color: #888; position: relative; }
        .cal-day.today { background: linear-gradient(135deg, var(--orange), var(--gold)); color: #000; font-weight: bold; box-shadow: 0 0 15px rgba(255,152,0,0.4); }
        
        /* 6. SANCTUM (Gate) */
        .temple-door {
            position: absolute; top: 0; bottom: 0; width: 50%; background: #3e2723; border: 2px solid #5d4037;
            z-index: 100; transition: transform 2s ease-in-out; display: flex; align-items: center; justify-content: center;
        }
        .door-left { left: 0; transform-origin: left; border-right: 2px solid #000; }
        .door-right { right: 0; transform-origin: right; border-left: 2px solid #000; }
        .sanctum-open .door-left { transform: perspective(1000px) rotateY(-80deg); }
        .sanctum-open .door-right { transform: perspective(1000px) rotateY(80deg); }
        .shivling-3d { width: 120px; height: 180px; background: radial-gradient(circle at 30% 30%, #444, #000); border-radius: 60px 60px 30px 30px; margin: 0 auto; }

        /* 4. CHAKRA (Body) */
        .body-outline { width: 120px; height: 300px; margin: 0 auto; background: rgba(255,255,255,0.05); border-radius: 60px 60px 40px 40px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; }
        .chakra-node { width: 25px; height: 25px; border-radius: 50%; box-shadow: 0 0 15px currentColor; cursor: pointer; transition: 0.3s; }
        .chakra-node:active { transform: scale(1.5); }

        /* 12. YATRA (Map) */
        .map-box { height: 350px; background: #111; position: relative; border-radius: 12px; border: 1px solid #333; overflow: hidden; }
        .jyoti-dot { width: 12px; height: 12px; background: var(--gold); border-radius: 50%; position: absolute; box-shadow: 0 0 15px var(--gold); cursor: pointer; animation: pulse 2s infinite; }
        
        /* 14. RUDRAKSHA (Mala) */
        .mala-container { overflow: hidden; height: 120px; display: flex; align-items: center; justify-content: center; }
        .bead-string { display: flex; gap: 5px; transition: transform 0.2s; }
        .bead { width: 50px; height: 50px; background: radial-gradient(circle, #8B4513, #3e1e05); border-radius: 50%; border: 1px solid #5e3a18; }

        /* 18. ASCENT (Mountain) */
        .mountain-path { border-left: 4px dashed #333; margin-left: 30px; position: relative; height: 450px; }
        .asc-stage { position: absolute; left: -12px; padding-left: 30px; cursor: pointer; transition: 0.3s; }
        .asc-node { width: 20px; height: 20px; background: #333; border-radius: 50%; position: absolute; left: 0; border: 2px solid #555; }
        .asc-stage.active .asc-node { background: var(--gold); box-shadow: 0 0 15px var(--gold); }

        @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,215,0,0.7);} 70%{box-shadow:0 0 0 10px rgba(255,215,0,0);} }

    </style>
</head>
<body>

    <div id="gate" onclick="OS.boot()">
        <div class="earth-btn">🌍</div>
        <p style="margin-top:30px; font-family:'Cinzel'; letter-spacing:4px; color:#aaa;">TAP TO ENTER</p>
    </div>

    <div id="os-ui">
        <div class="status-bar">
            <div id="clock">12:00</div>
            <div style="color:var(--gold);">🕉️ <span id="karma-pts">0</span></div>
        </div>
        <div id="home-screen"></div>
    </div>

    <div id="app-window">
        <div class="app-header">
            <div onclick="OS.close()" style="font-size:1.5rem; padding:10px; cursor:pointer; color:var(--gold);">❮</div>
            <div id="win-title" style="flex:1; text-align:center; font-family:'Cinzel'; font-weight:700;"></div>
            <div style="width:40px;"></div>
        </div>
        <div class="win-body" id="win-content"></div>
    </div>

    <script>
        const OS = {
            xp: parseInt(localStorage.getItem('shiva_xp') || 0),
            
            boot() {
                document.getElementById('gate').style.opacity = 0;
                setTimeout(() => {
                    document.getElementById('gate').style.display = 'none';
                    document.getElementById('os-ui').style.opacity = 1;
                    this.renderGrid();
                    setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), 1000);
                }, 800);
            },

            // 19 APPS (Sangha Removed)
            apps: [
                {id:'panchang', n:'Panchang', i:'📅', c:'#FFA726'}, // 1. Orange
                {id:'sanctum', n:'Sanctum', i:'🛕', c:'#FFD54F'}, // 6. Temple
                {id:'ahara', n:'Ahara', i:'🥗', c:'#81C784'}, // 10. Food
                {id:'sadhana', n:'Sadhana', i:'🔥', c:'#FF8A65'}, // 15. Tools
                {id:'media', n:'Media', i:'🎧', c:'#FF5252'}, // 2. Media
                {id:'parivar', n:'Parivar', i:'👪', c:'#BA68C8'}, // 7. Family
                {id:'gyan', n:'Gyan', i:'🧠', c:'#64B5F6'}, // 11. Wisdom
                {id:'yantra', n:'Yantra', i:'🧿', c:'#4FC3F7'}, // 16. Focus
                {id:'sankalpa', n:'Sankalpa', i:'📜', c:'#A1887F'}, // 3. Vows
                {id:'prasad', n:'Prasad', i:'🏆', c:'#F06292'}, // Stats
                {id:'yatra', n:'Yatra', i:'📍', c:'#DCE775'}, // 12. Map
                {id:'mantra', n:'Mantra', i:'🗣️', c:'#90A4AE'}, // 17. Mantra
                {id:'chakra', n:'Chakra', i:'🧘', c:'#7986CB'}, // 4. Chakra
                {id:'festivals', n:'Utsav', i:'🎉', c:'#FFD700'}, // 8. Utsav
                {id:'rudra', n:'Rudraksha', i:'📿', c:'#8D6E63'}, // 14. Mala
                {id:'ascent', n:'Ascent', i:'🏔️', c:'#9575CD'}, // 18. Game
                {id:'daan', n:'Daan', i:'🤲', c:'#AED581'}, // 5. Donate
                {id:'dreams', n:'Dreams', i:'✨', c:'#4DD0E1'}, // 9. Dreams
                {id:'settings', n:'Settings', i:'⚙️', c:'#E0E0E0'} // 19. Settings
            ],

            renderGrid() {
                const h = document.getElementById('home-screen');
                h.innerHTML = this.apps.map((a, i) => `
                    <div class="app-icon" style="animation-delay:${i*0.03}s" onclick="OS.open('${a.id}')">
                        <div class="icon-box" style="color:${a.c}; border-color:${a.c}44;">${a.i}</div>
                        <div class="icon-lbl">${a.n}</div>
                    </div>
                `).join('');
                document.getElementById('karma-pts').innerText = this.xp;
            },

            open(id) {
                document.getElementById('win-title').innerText = this.apps.find(a=>a.id===id).n;
                document.getElementById('win-content').innerHTML = Apps[id]();
                document.getElementById('app-window').classList.add('open');
                if(id === 'sanctum') setTimeout(() => document.getElementById('temple-gates').classList.add('sanctum-open'), 100);
            },
            close() { document.getElementById('app-window').classList.remove('open'); },
            addXP(n) { this.xp += n; localStorage.setItem('shiva_xp', this.xp); document.getElementById('karma-pts').innerText = this.xp; }
        };

        const Apps = {
            
            // 1. PANCHANG (Orange/Gold)
            panchang: () => {
                let g = '';
                for(let i=1; i<=30; i++) g += `<div class="cal-day ${i===14?'today':''}" onclick="alert('Day ${i}: Good for Sadhana'); OS.addXP(1)">${i}</div>`;
                return `
                    <div class="card panchang-card">
                        <div class="card-h" style="border-color:#ff9800;">December 2025</div>
                        <div class="cal-grid">${g}</div>
                    </div>
                    <div class="card">
                        <h3>Set Alarm</h3>
                        <button class="btn-gold" style="background:var(--orange);" onclick="alert('Alarm Set'); OS.addXP(5)">⏰ Set for Brahma Muhurta</button>
                    </div>`;
            },

            // 6. SANCTUM (Animation)
            sanctum: () => `
                <div style="position:relative; height:400px; overflow:hidden; border-radius:16px; margin-bottom:20px;" id="temple-gates">
                    <div class="temple-door door-left"><div style="font-size:3rem;">🚪</div></div>
                    <div class="temple-door door-right"><div style="font-size:3rem;">🚪</div></div>
                    <div style="height:100%; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                        <div class="shivling-3d"></div>
                        <div style="margin-top:20px; display:flex; gap:20px;">
                            <button class="btn-glass" onclick="new Audio('https://freesound.org/data/previews/398/398030_7636830-lq.mp3').play(); OS.addXP(2)">🔔 Bell</button>
                            <button class="btn-glass" onclick="OS.addXP(10); alert('Abhishekam Offered')">💧 Jal</button>
                        </div>
                    </div>
                </div>
            `,

            // 12. YATRA (Golden Map)
            yatra: () => `
                <div class="card">
                    <div class="map-box">
                        <div style="position:absolute; top:30%; left:30%;" class="jyoti-dot" onclick="alert('Somnath')"></div>
                        <div style="position:absolute; top:40%; left:45%;" class="jyoti-dot" onclick="alert('Mahakaleshwar')"></div>
                        <div style="position:absolute; top:45%; left:60%;" class="jyoti-dot" onclick="alert('Kashi')"></div>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/India_location_map.svg/640px-India_location_map.svg.png" style="width:100%; height:100%; opacity:0.3; object-fit:contain;">
                    </div>
                    <p style="text-align:center; margin-top:10px;">Tap Golden Jyotirlingas</p>
                </div>
            `,

            // 14. RUDRAKSHA (Physics)
            rudra: () => `
                <div class="card">
                    <div class="mala-container"><div class="bead-string" id="mala-str">${Array(10).fill('<div class="bead"></div>').join('')}</div></div>
                    <button class="btn-gold" onclick="document.getElementById('mala-str').style.transform='translateX(-55px)'; setTimeout(()=>{document.getElementById('mala-str').style.transition='none'; document.getElementById('mala-str').appendChild(document.getElementById('mala-str').firstElementChild); document.getElementById('mala-str').style.transform='translateX(0)'; setTimeout(()=>document.getElementById('mala-str').style.transition='transform 0.2s',50);},200); OS.addXP(1);">Pull Bead</button>
                </div>
            `,

            // 18. ASCENT (Game)
            ascent: () => `
                <div class="card">
                    <div class="mountain-path">
                        <div class="asc-stage active" style="bottom:0;" onclick="OS.addXP(10)"><div class="asc-node" style="background:gold;"></div> <span style="margin-left:30px;">1. Yama</span></div>
                        <div class="asc-stage" style="bottom:15%;" onclick="this.classList.add('active'); OS.addXP(20)"><div class="asc-node"></div> <span style="margin-left:30px;">2. Niyama</span></div>
                        <div class="asc-stage" style="bottom:30%;" onclick="this.classList.add('active'); OS.addXP(30)"><div class="asc-node"></div> <span style="margin-left:30px;">3. Asana</span></div>
                        <div class="asc-stage" style="bottom:45%;" onclick="this.classList.add('active'); OS.addXP(40)"><div class="asc-node"></div> <span style="margin-left:30px;">4. Pranayama</span></div>
                        <div class="asc-stage" style="bottom:60%;" onclick="this.classList.add('active'); OS.addXP(50)"><div class="asc-node"></div> <span style="margin-left:30px;">5. Pratyahara</span></div>
                        <div class="asc-stage" style="bottom:75%;" onclick="this.classList.add('active'); OS.addXP(60)"><div class="asc-node"></div> <span style="margin-left:30px;">6. Dharana</span></div>
                        <div class="asc-stage" style="bottom:90%; color:var(--gold);" onclick="this.classList.add('active'); OS.addXP(100); alert('Samadhi!')"><div class="asc-node" style="border-color:gold;"></div> <span style="margin-left:30px;">7. SAMADHI</span></div>
                    </div>
                </div>
            `,

            // 4. CHAKRA (Body UI)
            chakra: () => `
                <div class="card">
                    <div class="body-outline">
                        <div class="chakra-node" style="color:violet;" onclick="alert('Crown Activated')"></div>
                        <div class="chakra-node" style="color:indigo;" onclick="alert('Third Eye Activated')"></div>
                        <div class="chakra-node" style="color:blue;" onclick="alert('Throat Activated')"></div>
                        <div class="chakra-node" style="color:green;" onclick="alert('Heart Activated')"></div>
                        <div class="chakra-node" style="color:yellow;" onclick="alert('Solar Activated')"></div>
                        <div class="chakra-node" style="color:orange;" onclick="alert('Sacral Activated')"></div>
                        <div class="chakra-node" style="color:red;" onclick="alert('Root Activated')"></div>
                    </div>
                    <p style="text-align:center; margin-top:15px;">Tap chakras to meditate</p>
                </div>
            `,

            // 10. AHARA (Prompt)
            ahara: () => `
                <div class="card">
                    <input class="input-field" placeholder="How do you feel? (e.g. Lethargic)">
                    <button class="btn-gold" onclick="alert('Suggestion: Eat light fruits and avoid grains today.')">Get Advice</button>
                </div>
                <div class="card">
                    <h3>7 Day Plan</h3>
                    <div class="btn-glass" onclick="window.open('https://youtube.com/results?search_query=satvik+recipes')">Watch Recipes</div>
                </div>
            `,

            // 3. SANKALPA (Diary)
            sankalpa: () => `
                <div class="card">
                    <h3>Vow Diary</h3>
                    <input class="input-field" id="vow-txt" placeholder="I vow to...">
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <button class="btn-glass" onclick="document.getElementById('vow-txt').value='Calm'">Calm</button>
                        <button class="btn-glass" onclick="document.getElementById('vow-txt').value='Focus'">Focus</button>
                    </div>
                    <button class="btn-gold" onclick="document.getElementById('vow-list').innerHTML+='<li>'+document.getElementById('vow-txt').value+'</li>'; OS.addXP(5)">Commit</button>
                    <ul id="vow-list" style="margin-top:20px;"></ul>
                </div>
            `,

            // 5. DAAN (Links)
            daan: () => `<div class="card"><h3>Spiritual Giving</h3><p>Verified organizations:</p><button class="btn-gold" onclick="window.open('https://iskcon.org/donate')">ISKCON Food Relief</button><button class="btn-gold" style="margin-top:10px;" onclick="window.open('https://sadhguru.org/donate')">Isha Foundation</button></div>`,

            // 9. DREAMS (Wishlist)
            dreams: () => `<div class="card"><h3>Shiva Places Wishlist</h3><div style="margin-bottom:10px;"><input type="checkbox"> Kedarnath</div><div style="margin-bottom:10px;"><input type="checkbox"> Kashi</div><input class="input-field" placeholder="Add place..."><button class="btn-gold">Save</button></div>`,

            // 2. MEDIA
            media: () => `<div class="jyoti-grid">${['Meditation','Chants','Aarti','Mantra'].map(t=>`<div class="jyoti-card" onclick="window.open('https://youtube.com/results?search_query=shiva+${t}')">🎵<br>${t}</div>`).join('')}</div>`,

            // 11. GYAN
            gyan: () => `<div class="card" style="background:rgba(255,255,255,0.1); backdrop-filter:blur(20px);"><h3>Shiva Wisdom</h3><p>"You are not the body, you are not even the mind."</p></div>`,

            // 15. SADHANA
            sadhana: () => `<div class="card"><button class="btn-gold" onclick="this.style.background='red'; this.innerText='Recording...'">🎙️ Record Mantra</button></div><div class="card"><button class="btn-glass" onclick="window.open('https://youtube.com/results?search_query=shiva+sadhana+guide')">Watch Tutorial</button></div>`,

            // 7. PARIVAR
            parivar: () => `<div class="card"><div style="text-align:center;"><div style="font-size:3rem;">🔱</div><h3>Shiva</h3><button class="btn-glass" onclick="alert('Om Namah Shivaya')">Mantra</button></div></div>`,

            // 16. YANTRA
            yantra: () => `<div class="card" style="text-align:center;"><div style="width:150px; height:150px; border-radius:50%; background:conic-gradient(red,blue,green,red); margin:0 auto; animation:spin 2s linear infinite;"></div><p>Focus Center</p></div>`,

            // 17. MANTRA
            mantra: () => `<div class="card"><input class="input-field" placeholder="I feel..."><button class="btn-gold" onclick="alert('Chant: Om Namah Shivaya')">Get Mantra</button></div>`,

            // 8. UTSAV
            festivals: () => `<div class="card" style="text-align:center; border:2px solid gold;"><h1>26</h1><p>Days to Shivratri</p></div>`,

            // 19. SETTINGS
            settings: () => `<div class="card"><button class="btn-glass" onclick="alert('Language changed to Hindi')">Switch to Hindi / English</button><button class="btn-gold" style="margin-top:20px; background:#333;" onclick="localStorage.clear(); location.reload()">Reset App</button></div>`,

            // 10. PRASAD (Stats)
            prasad: () => `<div class="card" style="text-align:center;"><h1>${OS.xp}</h1><p>Karma Points</p></div>`
        };
    </script>
</body>
</html>
