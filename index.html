<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ShivaOS: Shivaverse 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Outfit', sans-serif; user-select: none; }
        
        /* HUD UI */
        #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Top Bar */
        .status-bar {
            padding: 20px; display: flex; justify-content: space-between; align-items: flex-start;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .karma-box {
            background: rgba(255, 215, 0, 0.15); border: 1px solid #FFD700; color: #FFD700;
            padding: 8px 20px; border-radius: 30px; font-weight: bold; backdrop-filter: blur(10px);
            text-shadow: 0 0 10px #FFD700; pointer-events: auto;
        }

        /* Interaction Prompt */
        #prompt-box {
            position: absolute; top: 20%; width: 100%; text-align: center;
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
        }
        .prompt-text {
            background: rgba(0,0,0,0.6); color: #fff; padding: 10px 20px; border-radius: 20px;
            display: inline-block; border: 1px solid rgba(255,255,255,0.2); font-size: 0.9rem;
        }

        /* Controls (Bottom Dock) */
        .dock-scroll {
            pointer-events: auto; display: flex; gap: 10px; overflow-x: auto; padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }
        .dock-scroll::-webkit-scrollbar { display: none; }
        
        .dock-btn {
            min-width: 65px; height: 65px; background: rgba(255,255,255,0.1); border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.15); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
            backdrop-filter: blur(5px); flex-shrink: 0;
        }
        .dock-btn.active { background: #FFD700; color: #000; transform: translateY(-10px); box-shadow: 0 0 20px #FFD700; }
        .btn-icon { font-size: 1.6rem; margin-bottom: 3px; }
        .btn-lbl { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }

        /* Loader */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s;
        }
        .spinner {
            width: 60px; height: 60px; border: 3px solid #333; border-top: 3px solid #FFD700;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="margin-top:20px; color:#888; font-size:0.8rem; letter-spacing:2px;">LOADING SHIVAVERSE...</div>
    </div>

    <div id="canvas-container" style="position:fixed; inset:0;"></div>

    <div id="hud">
        <div class="status-bar">
            <div style="font-weight:bold; color:rgba(255,255,255,0.7);">SHIVA OS</div>
            <div class="karma-box" onclick="alert('Your Karma Level: Yogi')">🕉️ <span id="xp">108</span></div>
        </div>

        <div id="prompt-box"><div class="prompt-text" id="prompt-msg">Welcome to Kailash</div></div>

        <div class="dock-scroll" id="dock">
            </div>
    </div>

    <script>
        /* --- 1. ENGINE CONFIG --- */
        const Engine = {
            scene: new THREE.Scene(),
            camera: new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000),
            renderer: new THREE.WebGLRenderer({antialias:true, alpha:true}),
            raycaster: new THREE.Raycaster(),
            mouse: new THREE.Vector2(),
            
            init() {
                // Setup
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);
                
                // Atmosphere
                this.scene.fog = new THREE.FogExp2(0x050510, 0.015);
                const amb = new THREE.AmbientLight(0xffffff, 0.6);
                const sun = new THREE.DirectionalLight(0xffd700, 1.5);
                sun.position.set(10, 20, 10);
                this.scene.add(amb, sun);

                // Stars
                this.addStars();

                // Build All 19 Zones
                World.build();

                // Initial Cam
                this.camera.position.set(0, 5, 15);
                
                // Events
                window.addEventListener('resize', ()=> {
                    this.camera.aspect = window.innerWidth/window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
                window.addEventListener('pointerdown', this.onClick.bind(this));

                // Start
                this.animate();
                setTimeout(()=>document.getElementById('loader').style.opacity=0, 1000);
                setTimeout(()=>document.getElementById('loader').style.display='none', 2000);
            },

            addStars() {
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(5000 * 3);
                for(let i=0; i<5000*3; i++) pos[i] = (Math.random()-0.5)*400;
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({color:0xffffff, size:0.1, transparent:true});
                this.scene.add(new THREE.Points(geo, mat));
            },

            onClick(e) {
                this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.scene.children, true);
                if(intersects.length > 0) {
                    // Traverse up to find clickable group/mesh
                    let obj = intersects[0].object;
                    while(obj.parent && !obj.userData.onClick) obj = obj.parent;
                    if(obj.userData.onClick) obj.userData.onClick();
                }
            },

            animate() {
                requestAnimationFrame(this.animate.bind(this));
                // Idle Rotations
                this.scene.children.forEach(c => {
                    if(c.userData.rotate) c.rotation.y += c.userData.speed || 0.005;
                    if(c.userData.float) c.position.y += Math.sin(Date.now()*0.001 + c.id)*0.002;
                });
                this.renderer.render(this.scene, this.camera);
            }
        };

        /* --- 2. GAME LOGIC --- */
        const Game = {
            xp: 108,
            addXP(n, msg) {
                this.xp += n;
                document.getElementById('xp').innerText = this.xp;
                this.showPrompt(`+${n} Karma: ${msg}`);
                confetti({ particleCount: 20, spread: 40, origin: { y: 0.8 }, colors:['#FFD700'] });
            },
            showPrompt(msg) {
                const p = document.getElementById('prompt-box');
                document.getElementById('prompt-msg').innerText = msg;
                p.style.opacity = 1;
                setTimeout(()=>p.style.opacity=0, 2500);
            }
        };

        /* --- 3. THE 19 ZONES (3D Objects) --- */
        const World = {
            zones: [
                {id:'sanctum', n:'Sanctum', i:'🛕', pos:{x:0, y:0, z:0}},
                {id:'sadhana', n:'Sadhana', i:'📿', pos:{x:-20, y:0, z:0}},
                {id:'yatra', n:'Yatra', i:'🗺️', pos:{x:20, y:0, z:0}},
                {id:'ahara', n:'Ahara', i:'🥗', pos:{x:0, y:0, z:-20}},
                {id:'ascent', n:'Ascent', i:'🏔️', pos:{x:0, y:20, z:0}},
                {id:'chakra', n:'Chakra', i:'🧘', pos:{x:-20, y:0, z:-20}},
                {id:'panchang', n:'Panchang', i:'📅', pos:{x:20, y:0, z:-20}},
                {id:'gyan', n:'Gyan', i:'🧠', pos:{x:0, y:-20, z:0}}, // Underworld/Cave
                {id:'parivar', n:'Parivar', i:'👪', pos:{x:10, y:0, z:10}},
                {id:'media', n:'Media', i:'🎧', pos:{x:-10, y:0, z:10}},
                {id:'yantra', n:'Yantra', i:'🧿', pos:{x:30, y:0, z:0}},
                {id:'mantra', n:'Mantra', i:'🗣️', pos:{x:-30, y:0, z:0}},
                {id:'sankalpa', n:'Sankalpa', i:'📜', pos:{x:0, y:0, z:20}},
                {id:'festivals', n:'Utsav', i:'🎉', pos:{x:15, y:5, z:-15}},
                {id:'daan', n:'Daan', i:'🤲', pos:{x:-15, y:5, z:-15}},
                {id:'dreams', n:'Dreams', i:'✨', pos:{x:0, y:10, z:-10}},
                {id:'rudra', n:'Rudraksha', i:'🌰', pos:{x:-25, y:5, z:5}},
                {id:'prasad', n:'Prasad', i:'🏆', pos:{x:25, y:5, z:5}},
                {id:'settings', n:'Settings', i:'⚙️', pos:{x:0, y:-10, z:10}}
            ],

            build() {
                // Populate Dock
                const dock = document.getElementById('dock');
                dock.innerHTML = this.zones.map(z => `
                    <div class="dock-btn" onclick="World.travel('${z.id}')">
                        <div class="btn-icon">${z.i}</div><div class="btn-lbl">${z.n}</div>
                    </div>
                `).join('');

                // Build each zone in 3D
                this.zones.forEach(z => {
                    const group = new THREE.Group();
                    group.position.set(z.pos.x, z.pos.y, z.pos.z);
                    
                    // Base Platform
                    const plat = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 0.2, 32), new THREE.MeshStandardMaterial({color:0x222222}));
                    plat.position.y = -0.1;
                    group.add(plat);

                    // Add Specific Content
                    if(z.id === 'sanctum') this.buildSanctum(group);
                    else if(z.id === 'yatra') this.buildYatra(group);
                    else if(z.id === 'sadhana') this.buildSadhana(group);
                    else if(z.id === 'ahara') this.buildAhara(group);
                    else if(z.id === 'chakra') this.buildChakra(group);
                    else if(z.id === 'ascent') this.buildAscent(group);
                    else if(z.id === 'panchang') this.buildPanchang(group);
                    else {
                        // Generic Placeholder for others (Glowing Orb)
                        const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshStandardMaterial({color:0x444444, wireframe:true}));
                        orb.position.y = 1.5;
                        orb.userData = {rotate:true, onClick:()=>Game.addXP(1, `Visited ${z.n}`)};
                        group.add(orb);
                        
                        // Floating Label
                        // (Text is complex in basic Three.js, using sprites or DOM overlays is better, skipped for pure code simplicity)
                    }

                    Engine.scene.add(group);
                });
            },

            travel(id) {
                const z = this.zones.find(z => z.id === id);
                // Camera offset based on zone type
                let yOff = 3, zOff = 8;
                if(id === 'ascent') { yOff = 8; zOff = 15; }
                if(id === 'yatra') { yOff = 6; zOff = 4; } // Top down

                gsap.to(Engine.camera.position, {
                    x: z.pos.x, y: z.pos.y + yOff, z: z.pos.z + zOff,
                    duration: 1.5,
                    ease: "power2.inOut",
                    onUpdate: () => Engine.camera.lookAt(z.pos.x, z.pos.y + 1, z.pos.z)
                });
                
                Game.showPrompt(z.n);
            },

            /* --- ZONE BUILDERS --- */
            
            buildSanctum(g) {
                // Shivling
                const ling = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.2, 4, 16), new THREE.MeshStandardMaterial({color:0x111111, roughness:0.1}));
                ling.position.y = 0.8;
                ling.userData = {onClick:()=>Game.addXP(5, "Om Namah Shivaya")};
                g.add(ling);
                
                // Kalash (Floating Pot)
                const pot = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({color:0xb87333}));
                pot.position.set(0, 3, 0);
                pot.userData = {onClick:()=>{ alert("Abhishekam!"); Game.addXP(10, "Holy Bath"); }};
                g.add(pot);
            },

            buildYatra(g) {
                // Map Table
                const table = new THREE.Mesh(new THREE.BoxGeometry(6, 0.2, 4), new THREE.MeshStandardMaterial({color:0x334455}));
                table.position.y = 0.5;
                g.add(table);
                // Golden Pins
                [{-1:-1}, {0:0}, {1:1}].forEach((p, i) => {
                    const pin = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 8), new THREE.MeshStandardMaterial({color:0xFFD700, emissive:0xFFD700}));
                    pin.position.set((i-1)*1.5, 0.8, (Math.random()-0.5)*2);
                    pin.userData = {float:true, onClick:()=>Game.addXP(20, "Jyotirlinga Visited")};
                    g.add(pin);
                });
            },

            buildSadhana(g) {
                // Giant Mala Ring
                for(let i=0; i<16; i++) {
                    const angle = (i/16) * Math.PI*2;
                    const bead = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshStandardMaterial({color:0x8B4513}));
                    bead.position.set(Math.cos(angle)*2.5, Math.sin(angle)*2.5 + 2, 0);
                    bead.userData = {onClick:()=> {
                        gsap.to(g.rotation, {z:g.rotation.z + 0.4});
                        Game.addXP(1, "Chant");
                    }};
                    g.add(bead);
                }
            },

            buildAhara(g) {
                // Table
                const table = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.1, 8), new THREE.MeshStandardMaterial({color:0x5d4037}));
                table.position.y = 0.5;
                g.add(table);
                // Food Orbs
                const apple = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshStandardMaterial({color:0x4CAF50}));
                apple.position.set(-0.5, 0.8, 0);
                apple.userData = {onClick:()=>Game.addXP(5, "Satvik Meal")};
                g.add(apple);
                
                const burger = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.4), new THREE.MeshStandardMaterial({color:0xF44336}));
                burger.position.set(0.5, 0.8, 0);
                burger.userData = {onClick:()=>alert("Avoid Tamasic Food!")};
                g.add(burger);
            },

            buildChakra(g) {
                // Chakra Column
                const colors = [0xff0000, 0xffa500, 0xffff00, 0x00ff00, 0x0000ff, 0x4b0082, 0xee82ee];
                colors.forEach((c, i) => {
                    const node = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshStandardMaterial({color:c, emissive:c, emissiveIntensity:0.5}));
                    node.position.y = 0.5 + (i * 0.7);
                    node.userData = {onClick:()=>Game.addXP(5, "Chakra Activated")};
                    g.add(node);
                });
            },

            buildAscent(g) {
                // Mountain Cone
                const mount = new THREE.Mesh(new THREE.ConeGeometry(5, 10, 4), new THREE.MeshStandardMaterial({color:0x333333, flatShading:true}));
                mount.position.y = 4;
                g.add(mount);
                // Steps
                for(let i=0; i<7; i++) {
                    const step = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, 1), new THREE.MeshStandardMaterial({color:0xFFD700}));
                    step.position.set(0, i*1.2 + 0.5, 2.5 - i*0.3);
                    step.userData = {onClick:()=>Game.addXP(10, `Ascended Level ${i+1}`)};
                    g.add(step);
                }
            },

            buildPanchang(g) {
                // Floating Ring of Dates
                const ring = new THREE.Group();
                ring.userData = {rotate:true, speed:0.002};
                for(let i=0; i<12; i++) {
                    const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.8), new THREE.MeshStandardMaterial({color:0xFFA726, side:THREE.DoubleSide}));
                    plate.position.set(Math.cos(i/12*6.28)*3, 2, Math.sin(i/12*6.28)*3);
                    plate.lookAt(0, 2, 0);
                    plate.userData = {onClick:()=>Game.addXP(2, "Date Checked")};
                    ring.add(plate);
                }
                g.add(ring);
            }
        };

        // Boot
        Engine.init();

    </script>
</body>
</html>
