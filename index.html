<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShivaOS: Kailash</title>
    <meta name="theme-color" content="#000000">
    <style>
        /* --- 1. PREMIUM TYPOGRAPHY --- */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Manrope:wght@300;500;700&display=swap');

        :root {
            --bg: #000000;
            --glass: rgba(20, 20, 25, 0.95);
            --glass-light: rgba(255, 255, 255, 0.05);
            --border: 1px solid rgba(255, 255, 255, 0.1);
            --gold: #FFD700;
            --rudra: #ff4444;
            --chakra: #00e5ff;
            --text: #ffffff;
            --nav-height: 90px;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Manrope', sans-serif; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e, #000);
        }

        /* --- 2. THE COSMIC GATE (ENTRY) --- */
        #gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
            background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.8s;
        }
        .gate-mandala {
            width: 220px; height: 220px; border: 1px solid var(--gold); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; position: relative;
            animation: spin 60s linear infinite; cursor: pointer;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.15);
        }
        .gate-mandala::before { content:''; position:absolute; inset:15px; border:1px dashed rgba(255,255,255,0.2); border-radius:50%; }
        .gate-icon { font-size: 5rem; animation: breathe 4s infinite; transform: rotate(0deg) !important; }
        .gate-text { margin-top: 40px; font-family: 'Cinzel'; letter-spacing: 6px; color: #666; font-size: 0.7rem; text-transform: uppercase; }
        
        @keyframes spin { 100%{transform:rotate(360deg);} }
        @keyframes breathe { 0%,100%{opacity:0.6; transform:scale(1);} 50%{opacity:1; transform:scale(1.1);} }

        /* --- 3. VIEWPORT --- */
        #viewport { flex: 1; position: relative; overflow: hidden; }
        .view {
            position: absolute; inset: 0; overflow-y: auto; padding: 20px; padding-bottom: calc(var(--nav-height) + 20px);
            display: none; opacity: 0; transform: scale(0.95); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .view.active { display: block; opacity: 1; transform: scale(1); }

        /* --- UI KIT --- */
        .card { background: var(--glass); border: var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(15px); }
        .card-h { font-family: 'Cinzel'; color: var(--gold); font-size: 1.1rem; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .btn-gold { width:100%; background: var(--gold); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.9rem; margin-top: 10px; }
        .btn-glass { padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; font-size: 0.8rem; cursor: pointer; color: #ccc; transition: 0.2s; }
        .btn-glass:active { background: var(--gold); color: #000; }

        /* --- TAB 1: HOME (PANCHANG) --- */
        .cal-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day { padding: 12px 0; background: #111; border-radius: 8px; font-size: 0.85rem; color: #888; }
        .cal-day.somvar { border: 1px solid #4CAF50; color: #4CAF50; font-weight: bold; }
        .cal-day.today { background: var(--gold); color: #000; font-weight: bold; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        
        .timeline { border-left: 2px solid #333; margin-left: 10px; padding-left: 25px; margin-top: 20px; }
        .t-slot { margin-bottom: 30px; position: relative; }
        .t-slot::before { content:''; position:absolute; left:-31px; top:5px; width:10px; height:10px; background:#000; border:2px solid var(--gold); border-radius:50%; }

        /* --- TAB 2: SANCTUM (PUJA) --- */

        .kalash { width: 90px; height: 70px; background: linear-gradient(135deg, #b87333, #e6a36c); border-radius: 10px 10px 40px 40px; z-index: 20; cursor: pointer; transition: transform 0.2s; box-shadow: 0 10px 30px #000; }
        .kalash:active { transform: rotate(-10deg) translateY(5px); }
        .stream { position: absolute; top: 130px; width: 6px; height: 0; background: linear-gradient(to bottom, #fff, #87ceeb); transition: height 0.2s; z-index: 15; opacity: 0.8; box-shadow: 0 0 15px #87ceeb; border-radius: 4px; }

        .ash { width: 80px; height: 5px; background: #ddd; margin: 6px auto; border-radius: 50%; box-shadow: 0 0 5px #fff; }
        .dot { width: 12px; height: 12px; background: red; border-radius: 50%; margin: 8px auto; box-shadow: 0 0 10px red; }
