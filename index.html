<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ShivaOS: Turbo</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Outfit', sans-serif; user-select: none; }
        
        /* --- LOADER (OPTIMIZED) --- */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid #333; border-top: 3px solid #FFD700;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        .load-text { margin-top: 20px; color: #888; font-size: 0.8rem; letter-spacing: 2px; font-family: monospace; }
        .progress-bar { width: 200px; height: 4px; background: #222; margin-top: 10px; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: #FFD700; width: 0%; transition: width 0.1s; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- HUD --- */
        #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; opacity: 0; transition: opacity 1s; }
        
        .status-bar {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        .karma-badge {
            background: rgba(255, 215, 0, 0.1); border: 1px solid #FFD700; color: #FFD700;
            padding: 5px 15px; border-radius: 20px; font-weight: bold; backdrop-filter: blur(5px);
            pointer-events: auto;
        }

        /* --- DOCK --- */
        .dock-container {
            pointer-events: auto; background: linear-gradient(to top, rgba(0,0,0,1), transparent);
            padding: 20px 0; overflow-x: auto; display: flex; justify-content: center;
        }
        .dock-scroll { display: flex; gap: 15px; padding: 0 20px; }
        .dock-btn {
            width: 60px; height: 60px; background: rgba(30,30,30,0.8); border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .dock-btn.active { background: #FFD700; color: #000; transform: translateY(-10px); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .btn-icon { font-size: 1.5rem; margin-bottom: 2px; }
        .btn-lbl { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }

        /* --- PROMPT --- */
        #prompt {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); border: 1px solid #444; padding: 10px 20px;
            border-radius: 30px; color: #fff; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }

    </style>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="load-text" id="load-status">INITIALIZING...</div>
        <div class="progress-bar"><div class="progress-fill" id="load-bar"></div></div>
    </div>

    <div id="canvas-container" style="position:fixed; inset:0; z-index:0;"></div>

    <div id="hud">
        <div class="status-bar">
            <div style="font-weight:bold; color:#888;">SHIVA OS</div>
            <div class="karma-badge">🕉️ <span id="xp">108</span></div>
        </div>
        <div id="prompt">Welcome</div>
        <div class="dock-container">
            <div class="dock-scroll" id="dock"></div>
        </div>
    </div>

    <script>
        /* --- OPTIMIZED LOADING SEQUENCE --- */
        window.addEventListener('load', () => {
            // Check if Three.js loaded
            const check = setInterval(() => {
                if (window.THREE && window.gsap) {
                    clearInterval(check);
                    Engine.init();
                }
            }, 100);
        });

        const Engine = {
            scene: null, camera: null, renderer: null,
            
            async init() {
                const updateLoad = (txt, pct) => {
                    document.getElementById('load-status').innerText = txt;
                    document.getElementById('load-bar').style.width = pct + '%';
                };

                updateLoad("STARTING ENGINE...", 10);

                // 1. Setup Scene
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x000000, 0.02);
                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);
                this.renderer = new THREE.WebGLRenderer({antialias: true, powerPreference: "high-performance"});
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for speed
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                updateLoad("LIGHTING...", 30);
                const amb = new THREE.AmbientLight(0xffffff, 0.5);
                const dir = new THREE.DirectionalLight(0xffd700, 1.5);
                dir.position.set(10, 20, 10);
                this.scene.add(amb, dir);

                // 2. Build World (Sequential to prevent freeze)
                const zones = World.zones;
                const total = zones.length;
                
                for (let i = 0; i < total; i++) {
                    await new Promise(r => setTimeout(r, 20)); // Breathe frame
                    World.buildZone(zones[i]);
                    updateLoad(`BUILDING ${zones[i].n.toUpperCase()}...`, 30 + ((i/total)*60));
                }

                updateLoad("AWAKENING...", 100);
                
                // 3. Render Loop
                this.camera.position.set(0, 3, 10);
                this.animate();

                // 4. UI Transition
                setTimeout(() => {
                    document.getElementById('loader').style.opacity = 0;
                    document.getElementById('hud').style.opacity = 1;
                    setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
                }, 500);

                // 5. Build Dock
                World.renderDock();
            },

            animate() {
                requestAnimationFrame(this.animate.bind(this));
                // Minimal animation for performance
                this.renderer.render(this.scene, this.camera);
            },

            moveTo(pos) {
                gsap.to(this.camera.position, {
                    x: pos.x, y: pos.y + 3, z: pos.z + 8,
                    duration: 1.2,
                    ease: "power2.inOut",
                    onUpdate: () => this.camera.lookAt(pos.x, pos.y+1, pos.z)
                });
            }
        };

        const World = {
            zones: [
                {id:'sanctum', n:'Sanctum', i:'🛕', x:0, z:0, col:0x333333},
                {id:'sadhana', n:'Sadhana', i:'📿', x:-15, z:0, col:0x5d4037},
                {id:'yatra', n:'Yatra', i:'🗺️', x:15, z:0, col:0x224466},
                {id:'ascent', n:'Ascent', i:'🏔️', x:0, z:-15, col:0x444444},
                {id:'panchang', n:'Panchang', i:'📅', x:0, z:15, col:0xFFA726},
                // Add more zones virtually
            ],

            buildZone(z) {
                const g = new THREE.Group();
                g.position.set(z.x, 0, z.z);

                // Base Platform (Low Poly)
                const plat = new THREE.Mesh(
                    new THREE.CylinderGeometry(3, 3, 0.2, 16), // Reduced segments
                    new THREE.MeshStandardMaterial({color: z.col})
                );
                g.add(plat);

                // Content Placeholder (Low Poly)
                let content;
                if(z.id === 'sanctum') content = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1, 4, 8), new THREE.MeshStandardMaterial({color:0x111})); // Lingam
                else if(z.id === 'sadhana') content = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.1, 8, 16), new THREE.MeshStandardMaterial({color:0x8B4513})); // Mala
                else content = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({color:0xFFD700, wireframe:true}));
                
                content.position.y = 1;
                g.add(content);
                Engine.scene.add(g);
            },

            renderDock() {
                const d = document.getElementById('dock');
                d.innerHTML = this.zones.map(z => `
                    <div class="dock-btn" onclick="World.go('${z.id}')">
                        <div class="btn-icon">${z.i}</div><div class="btn-lbl">${z.n}</div>
                    </div>
                `).join('');
                // Add placeholders for the rest of 19 tabs
                const others = ['Ahara','Media','Parivar','Gyan','Yantra','Mantra','Sankalpa','Prasad','Chakra','Utsav','Daan','Dreams','Rudra','Settings'];
                d.innerHTML += others.map(n => `
                    <div class="dock-btn" onclick="alert('${n} Coming Soon in 3D')">
                        <div class="btn-icon">✨</div><div class="btn-lbl">${n}</div>
                    </div>
                `).join('');
            },

            go(id) {
                const z = this.zones.find(z => z.id === id);
                Engine.moveTo({x:z.x, y:0, z:z.z});
                
                const p = document.getElementById('prompt');
                p.innerText = z.n; p.style.opacity = 1;
                setTimeout(()=>p.style.opacity=0, 2000);
            }
        };
    </script>
</body>
</html>
