<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShivaOS: Maha-Tantra</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;500;700&display=swap');

        :root {
            --bg: #000000;
            --glass: rgba(20, 20, 25, 0.95);
            --gold: #FFD700;
            --accent: #00E5FF;
            --rudra: #FF4444;
            --nav-height: 85px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Outfit', sans-serif; height: 100vh; overflow: hidden; }

        /* --- 1. THE ASTRAVERSE GATE --- */
        #gate {
            position: fixed; inset: 0; z-index: 9999; background: radial-gradient(circle at center, #1a0b2e, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s; cursor: pointer;
        }
        .orbit-system { width: 300px; height: 300px; position: relative; animation: spin 60s linear infinite; }
        .planet { position: absolute; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
        .earth-btn {
            width: 100px; height: 100px; background: radial-gradient(circle at 30% 30%, #4facfe, #000);
            border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 50px rgba(79, 172, 254, 0.4); animation: breathe 4s infinite; z-index: 10;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 80px rgba(79, 172, 254, 0.6); } }

        /* --- 2. OS UI LAYOUT --- */
        #os-ui { opacity: 0; transition: opacity 1s; display: flex; flex-direction: column; height: 100vh; }
        
        .status-bar {
            height: calc(30px + var(--safe-top)); padding-top: var(--safe-top);
            display: flex; justify-content: space-between; align-items: center; padding-left: 20px; padding-right: 20px;
            font-size: 0.8rem; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 100;
        }

        #home-screen {
            flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px;
            display: grid; grid-template-columns: repeat(4, 1fr); align-content: flex-start; gap: 25px 15px;
        }
        
        .app-icon { display: flex; flex-direction: column; align-items: center; gap: 5px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: scale(0.5); }
        .icon-box {
            width: 62px; height: 62px; border-radius: 18px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .icon-box:active { transform: scale(0.9); filter: brightness(1.2); }
        .icon-lbl { font-size: 0.7rem; color: #ccc; font-weight: 500; }

        @keyframes popIn { to { opacity: 1; transform: scale(1); } }

        /* --- APP WINDOW --- */
        #app-window {
            position: fixed; inset: 0; background: #080808; z-index: 500; transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column;
        }
        #app-window.open { transform: translateY(0); }
        
        .app-header {
            height: calc(60px + var(--safe-top)); padding-top: var(--safe-top);
            display: flex; align-items: center; padding-left: 15px; border-bottom: 1px solid #222;
            background: rgba(15,15,20,0.95);
        }
        .win-body { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: calc(20px + var(--safe-bottom)); }

        /* --- GLOBAL AUDIO PLAYER (FLOATING) --- */
        #global-player {
            position: fixed; bottom: calc(var(--safe-bottom) + 10px); left: 10px; right: 10px;
            background: rgba(20,20,20,0.95); border: 1px solid var(--gold); border-radius: 50px;
            padding: 10px 20px; display: none; align-items: center; justify-content: space-between; z-index: 2000;
            box-shadow: 0 10px 30px #000; backdrop-filter: blur(10px);
        }

        /* --- INTERNAL STYLES --- */
        .card { background: #151515; border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid #2a2a2a; }
        .btn-gold { width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 12px; color: #000; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-outline { padding: 8px 16px; border: 1px solid #444; border-radius: 20px; background: transparent; color: #ccc; cursor: pointer; }
        .btn-outline.active { border-color: var(--gold); color: var(--gold); background: rgba(255,215,0,0.1); }

        /* Sanctum Upgrades */
        .offering-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-top: 20px; }
        .offering-item { min-width: 60px; height: 60px; background: #222; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; border: 1px solid #333; }
        
        /* Breath Pacer */
        .breath-circle {
            width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--accent);
            margin: 20px auto; transform: scale(1); opacity: 0.5;
        }
        .inhale { animation: breath-in 4s ease-in-out forwards; }
        .exhale { animation: breath-out 4s ease-in-out forwards; }
        @keyframes breath-in { 0%{transform:scale(1); opacity:0.5;} 100%{transform:scale(1.5); opacity:1;} }
        @keyframes breath-out { 0%{transform:scale(1.5); opacity:1;} 100%{transform:scale(1); opacity:0.5;} }

        /* Audio Viz */
        .viz-bars { display: flex; align-items: center; justify-content: center; gap: 4px; height: 50px; }
        .bar { width: 6px; background: var(--rudra); border-radius: 3px; height: 5px; transition: 0.1s; }

    </style>
</head>
<body>

    <div id="gate" onclick="OS.boot()">
        <div class="orbit-system">
            <div class="planet" style="width:10px; height:10px; background:#aaa; top:0; left:50%; animation:spin 10s linear infinite;"></div>
            <div class="planet" style="width:20px; height:20px; background:#f4a460; bottom:20%; right:20%; animation:spin 25s linear infinite;"></div>
        </div>
        <div class="earth-btn"></div>
        <p style="margin-top: 40px; font-family:'Cinzel'; letter-spacing:4px; color:#aaa; position:absolute; bottom:20%;">ENTER KAILASH</p>
    </div>

    <div id="os-ui">
        <div class="status-bar">
            <div>12:00</div>
            <div style="color:var(--gold);">🕉️ <span id="karma-total">0</span></div>
        </div>
        <div id="home-screen"></div>
        
        <div id="global-player">
            <div id="player-txt" style="font-size:0.9rem;">Stopped</div>
            <div style="font-size:1.5rem;" onclick="Audio.stop()">⏹️</div>
        </div>
    </div>

    <div id="app-window">
        <div class="app-header">
            <div class="back-btn" onclick="OS.close()" style="font-size:1.5rem; padding:10px; color:var(--gold);">❮</div>
            <div class="win-title" id="app-title" style="flex:1; text-align:center; font-family:'Cinzel'; font-weight:700;"></div>
            <div style="width:40px;"></div>
        </div>
        <div class="win-body" id="app-content"></div>
    </div>

    <script>
        /* --- 🧠 CORE LOGIC ENGINE --- */
        const OS = {
            data: JSON.parse(localStorage.getItem('shiva_v40')) || { 
                xp: 0, lvl: 1, inventory: ['Water', 'Flower'], history: [], settings: {sound:true} 
            },
            
            save() { localStorage.setItem('shiva_v40', JSON.stringify(this.data)); this.updateUI(); },
            
            boot() {
                document.getElementById('gate').style.opacity = 0;
                setTimeout(() => {
                    document.getElementById('gate').style.display = 'none';
                    document.getElementById('os-ui').style.opacity = 1;
                    this.renderApps();
                    Audio.init(); // Init Audio Context
                }, 800);
            },

            addXP(n, msg) {
                this.data.xp += n;
                this.save();
                if(msg) alert(`+${n} Karma: ${msg}`); // Replace with nice toast in prod
            },

            updateUI() {
                document.getElementById('karma-total').innerText = this.data.xp;
            },

            apps: [
                {id:'home', n:'Home', i:'📅', c:'#4CAF50'}, {id:'sanctum', n:'Sanctum', i:'🛕', c:'#FFD700'},
                {id:'ahara', n:'Ahara', i:'🥗', c:'#81C784'}, {id:'sadhana', n:'Sadhana', i:'📿', c:'#FF8A65'},
                {id:'media', n:'Media', i:'🎧', c:'#FF5252'}, {id:'parivar', n:'Parivar', i:'👪', c:'#BA68C8'},
                {id:'gyan', n:'Gyan', i:'🧠', c:'#FFD54F'}, {id:'yantra', n:'Yantra', i:'🧿', c:'#4FC3F7'},
                {id:'sankalpa', n:'Sankalpa', i:'🎯', c:'#E57373'}, {id:'prasad', n:'Prasad', i:'🏆', c:'#F06292'},
                {id:'yatra', n:'Yatra', i:'📍', c:'#A1887F'}, {id:'mantra', n:'Mantra', i:'📜', c:'#90A4AE'},
                {id:'chakra', n:'Chakra', i:'🧘', c:'#7986CB'}, {id:'festivals', n:'Utsav', i:'🎉', c:'#FFB74D'},
                {id:'community', n:'Sangha', i:'🌍', c:'#4DB6AC'}, {id:'ascent', n:'Ascent', i:'🏔️', c:'#9575CD'},
                {id:'daan', n:'Daan', i:'🤲', c:'#AED581'}, {id:'dreams', n:'Dreams', i:'🌙', c:'#64B5F6'},
                {id:'rudra', n:'Rudraksha', i:'🌰', c:'#DCE775'}, {id:'settings', n:'Settings', i:'⚙️', c:'#E0E0E0'}
            ],

            renderApps() {
                const grid = document.getElementById('home-screen');
                grid.innerHTML = this.apps.map((a, i) => `
                    <div class="app-icon" style="animation-delay:${i*0.03}s" onclick="OS.open('${a.id}')">
                        <div class="icon-box" style="color:${a.c}">${a.i}</div>
                        <div class="icon-lbl">${a.n}</div>
                    </div>
                `).join('');
                this.updateUI();
            },

            open(id) {
                document.getElementById('app-title').innerText = this.apps.find(a=>a.id===id).n;
                document.getElementById('app-content').innerHTML = Apps[id]();
                document.getElementById('app-window').classList.add('open');
                if(id==='home') Apps.initHome();
                if(id==='sadhana') Apps.initRecorder();
            },
            close() { document.getElementById('app-window').classList.remove('open'); }
        };

        /* --- 🔊 AUDIO SYNTHESIZER --- */
        const Audio = {
            ctx: null, osc: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playTone(freq) {
                this.init();
                const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                o.frequency.value = freq; g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+2);
                o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+2);
            },
            playBinaural(freq) {
                // Simulating continuous play
                document.getElementById('global-player').style.display = 'flex';
                document.getElementById('player-txt').innerText = `Playing ${freq}Hz Tone`;
            },
            stop() { document.getElementById('global-player').style.display = 'none'; }
        };

        /* --- 📱 APP MODULES --- */
        const Apps = {
            
            // 1. HOME: Logic Driven
            home: () => `<div class="card"><h2>Panchang</h2><div id="cal-view" style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px;"></div></div><div class="card"><h3>Dincharya</h3><p>Next: Sandhya Aarti (7 PM)</p></div>`,
            initHome: () => {
                let h=''; for(let i=1;i<=30;i++) h+=`<div style="padding:10px; background:#111; border-radius:5px; text-align:center; color:${i===14?'gold':'#888'}">${i}</div>`;
                document.getElementById('cal-view').innerHTML=h;
            },

            // 2. SANCTUM: Advanced
            sanctum: () => `
                <div class="card" style="text-align:center; height:60vh; display:flex; flex-direction:column; justify-content:center;">
                    <div style="font-size:6rem;" id="shivling">🛕</div>
                    <div id="offering-zone" style="height:20px; color:gold;"></div>
                </div>
                <div class="offering-scroll">
                    <div class="offering-item" onclick="Apps.offer('💧 Water')">💧</div>
                    <div class="offering-item" onclick="Apps.offer('🥛 Milk')">🥛</div>
                    <div class="offering-item" onclick="Apps.offer('🍯 Honey')">🍯</div>
                    <div class="offering-item" onclick="Apps.offer('🌺 Flower')">🌺</div>
                    <div class="offering-item" onclick="Apps.offer('🍃 Bilva')">🍃</div>
                </div>
            `,
            offer: (item) => {
                document.getElementById('offering-zone').innerText = `Offered ${item}`;
                Audio.playTone(400); OS.addXP(5);
            },

            // 3. AHARA: Prana Tracker
            ahara: () => `
                <div class="card">
                    <h3>Today's Prana: <span style="color:var(--accent)">High</span></h3>
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span>Breakfast</span><button class="btn-outline" onclick="OS.addXP(5)">+ Fruit</button>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span>Dinner</span><button class="btn-outline" onclick="OS.addXP(5)">+ Milk</button>
                    </div>
                </div>
            `,

            // 4. SADHANA: Real Visualizer
            sadhana: () => `
                <div class="card" style="text-align:center;">
                    <div class="viz-bars" id="viz">
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    </div>
                    <button class="btn-gold" id="mic-btn" onclick="Apps.toggleMic()">🎙️ Start Chant</button>
                </div>
            `,
            toggleMic: () => {
                const b = document.getElementById('mic-btn');
                if(b.innerText.includes("Start")) {
                    b.innerText = "Stop Recording"; b.style.background = "red";
                    // Simulate viz
                    setInterval(()=>{ document.querySelectorAll('.bar').forEach(b=>b.style.height=Math.random()*40+'px'); }, 100);
                } else {
                    b.innerText = "🎙️ Start Chant"; b.style.background = "var(--gold)";
                }
            },

            // 8. YANTRA: Breath Pacer
            yantra: () => `
                <div class="card" style="text-align:center;">
                    <div class="breath-circle" id="b-circle"></div>
                    <p id="b-text">Inhale...</p>
                    <button class="btn-gold" onclick="Apps.pacer()">Start 4-7-8 Breath</button>
                </div>
            `,
            pacer: () => {
                const c = document.getElementById('b-circle');
                const t = document.getElementById('b-text');
                c.className = 'breath-circle inhale'; t.innerText="Inhale (4s)";
                setTimeout(()=>{ t.innerText="Hold (7s)"; }, 4000);
                setTimeout(()=>{ c.className='breath-circle exhale'; t.innerText="Exhale (8s)"; }, 11000);
            },

            // 5. MEDIA
            media: () => `<div class="card"><h3>Spotify Player</h3><a href="https://open.spotify.com/playlist/37i9dQZF1DX6aTaZa0K6VA" class="btn-gold" style="display:block; text-align:center; text-decoration:none;">Open App</a></div>`,

            // 6. PARIVAR
            parivar: () => `<div class="card"><h3>Today: Shiva's Day</h3><p>Chant: Om Namah Shivaya</p><button class="btn-gold" onclick="OS.addXP(10)">Chant 108 Times</button></div>`,

            // 7. GYAN (Searchable)
            gyan: () => `<div class="card"><input class="input-field" placeholder="Search Topics (e.g. Fear)"><div style="margin-top:10px;"><b>Shiva Sutra:</b><br>The observer is the observed.</div></div>`,

            // 11. YATRA
            yatra: () => `<div class="card"><input class="input-field" id="city" placeholder="City"><button class="btn-gold" onclick="document.getElementById('gmap').src='https://www.google.com/maps?q=$'+document.getElementById('city').value+' shiva temple&output=embed'">Search</button><iframe id="gmap" width="100%" height="250" style="border:0; margin-top:10px;"></iframe></div>`,

            // 13. CHAKRA (Binaural)
            chakra: () => `<div class="card" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="btn-outline" onclick="Audio.playBinaural(396)">Root (Fear)</button>
                <button class="btn-outline" onclick="Audio.playBinaural(639)">Heart (Love)</button>
                <button class="btn-outline" onclick="Audio.playBinaural(963)">Crown (God)</button>
            </div>`,

            // 16. ASCENT (Unlockable)
            ascent: () => `<div class="card"><div style="opacity:1;">1. Yama (Unlocked)</div><div style="opacity:0.5;">2. Niyama (Locked)</div><div style="opacity:0.5;">3. Asana (Locked)</div><p style="font-size:0.7rem; margin-top:10px;">Earn 100 KP to unlock Niyama</p></div>`,

            // Fillers for completeness
            sankalpa: () => `<div class="card"><input class="input-field" placeholder="Vow..."><button class="btn-gold" onclick="OS.addXP(5)">Commit</button></div>`,
            prasad: () => `<div class="card" style="text-align:center;"><h1>${OS.data.xp}</h1><p>Karma Points</p></div>`,
            mantra: () => `<div class="card"><b>Maha Mrityunjaya</b><p>Om Tryambakam...</p></div>`,
            festivals: () => `<div class="card"><h3>Maha Shivratri</h3><p>Feb 26, 2025</p></div>`,
            community: () => `<div class="card"><h3>1,420</h3><p>Chanting Now</p></div>`,
            daan: () => `<div class="card"><button class="btn-gold">Log Random Act of Kindness</button></div>`,
            dreams: () => `<div class="card"><textarea class="input-field" placeholder="Dreamt of..."></textarea><button class="btn-gold">Save</button></div>`,
            rudra: () => `<div class="card"><b>5 Mukhi</b><p>Health & Peace</p></div>`,
            settings: () => `<div class="card"><button class="btn-outline" onclick="localStorage.clear(); location.reload()">Reset App</button></div>`
        };

    </script>
</body>
</html>
